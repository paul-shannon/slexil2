  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    This recording is a continuation of #95. Speakers are Shx̱'oosaxws
    Verna Johnson, (Raven, Deisheetaan, Ka ḵáak'w hít, Tsaagweidé
    Yádi, Aangoon Ḵwáan), Shḵanyadaká Elizabeth McCluskey (Raven,
    L'eeneidí, Aanx̱’aak Hít, T'eiḵweidi Yádi, Aangoon Ḵwáan), Kaseix
    Selina Everson (Raven, Deisheetaan, Raven House - Angoon, child of
    the Kaagwaantaan, grandaughter of the bear clan Teḵweidí,
    Raven/Beaver) and Shák’ Sháani Éesh Konrad Frank. Recorded May 19,
    2013, at Admiralty Suites, Angoon, AK, by Tuli.aan Carolyn
    Anderson.
    </div>"

