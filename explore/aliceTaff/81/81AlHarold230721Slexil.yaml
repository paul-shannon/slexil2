    endTime: 493701
    utterance: Itʼs hard to, itʼs hard to, Itʼs hard to explain things in Tlingit you know, especially if youʼre not real fluent in Tlingit. But my grandfather Gambier Bay Jim was a medicine man. A spiritual, a healer they, they called him. See they uh, uh, they called uh,

