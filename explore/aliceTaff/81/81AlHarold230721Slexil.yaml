  - lineNumber: 113
    startTime: 500208
    endTime: 508120
    utterance: We didnʼt have shamans. Thatʼs a, thatʼs a white manʼs word, shaman. Our, our name for our medicine men was

  - lineNumber: 114
    startTime: 508320
    endTime: 510063
    utterance: íx̱tʼ.
    translation: Spiritual healer.

  - lineNumber: 115
    startTime: 510263
    endTime: 569892
    utterance: And uh, it depends on how many spirits they have. I think seven spirits was the maximum you can have. And they did it by doing certain things like cutting the tongues of certain animals. It was very, very sacred. And, uh, I remember going to Gambier Bay with my, my dad. My, my grandfatherʼs cabin was still standing, about the size of this room. And he said, "We canʼt go in there." He said, "He can go in there but we canʼt go in because weʼre the opposite clan." You know, and then but, but he talked to him. He talked to his dad and brought us in. And when he brought us in he told him in Tlingit that, "I brought my," my, my, no, "I brought your grandchildren here to see you." They said you can talk to them, the spirit. Theyʼre spirits. They said they can still hear you. 

  - lineNumber: 116
