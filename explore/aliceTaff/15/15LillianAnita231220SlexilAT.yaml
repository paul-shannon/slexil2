  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Saḵaayí Anita Lafferty and Yax̱duláktʼ Lillian Austin,
    two sisters. Recorded May 18, 2010, by Ljáaḵkʼ Alice Taff and
    Liana Wallace at the Lafferty home in Juneau, Alaska.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
