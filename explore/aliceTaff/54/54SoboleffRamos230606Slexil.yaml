    utterance: I taught at the University of Alaska Fairbanks for three years. And the students, the students asked the administration for a Native Studies department in 1970. And the university okayed it, administration. And I saw it in an ad in the paper and I answered it. And then they sent two students down to interview me. And then I was asked to come up there to be looked at by their faculty too. And then I got the job to head the Native Studies department. I think I had the biggest class forty and fifty.

