  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Ḵintóo Adeline St. Clair (Yéil, Deisheeitaan, Yeil
    Sʼaagí Hít) and Ḵaakwéitʼ Deborah Dalton (Chʼaakʼ, Chookaneidí,
    Xaatl Hít, Tʼaḵdeintaan yadi). Recorded July 14, 2011 in Hoonah,
    Alaska, by Ljáaḵkʼ Alice Taff and Naakil.aan Mark Hans Chester.
    </div>"
    
  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Tlingit transcription by X̱ʼaagi Sháawu Keri Eggleston. English
    translation by Shakʼsháani Margaret Dutson with Ljáaḵkʼ Alice
    Taff. Edited by Shag̱aaw Éesh Devlin Anderstrom.
    </div>"

