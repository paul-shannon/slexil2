  - lineNumber: 91
    startTime: 492910
    endTime: 558465
    utterance: My sister-in-law. We traveled together. And all the way to Arizona. They used to know the ministers. So he took us to some places where he knew and we ministered the people. All the way to Arizona and then we come back. We don't stay here when we come back. We go to Juneau. We go to Yakutat and from Yakutat we go to Anchorage where my youngest daughter, that's where she lived, Brenda. 

  - lineNumber: 92
    startTime: 558665
