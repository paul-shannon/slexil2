  - lineNumber: 101
    startTime: 685453
    endTime: 1101682
    utterance: to yú crossroad on that side, that's how far they, that they drug her, that girl. And she hasn't ate for how many days. They're trying to feed. Her grandma trying to feed that girl. But after that {she couldn't open} she opened the door on the refrigerator, and she closed it without even eating. And that day what happened was; when we were there, after she got done that lady {from} in Ketchikan was talking to, to Beth. I was sitting there, and I told them, "I'm going to get my guitar itʼs, it's right there. And then we're going to sing a song and then we're going to pray for this young lady." And after I got done singing then that young girl, her grandma called her. "Come on, they're going to pray for you." We just prayed {just} and after we finished praying, she was moving in the house, that girl. And after she was moving around, she went to the refrigerator, opened the door. And she reached in there, she got something from there to eat. "Oh, praise the Lord," she said, that grandma. She's been trying to do that for how many months, about three months, I guess. Now she's eating from the refrigerator. And then they called us to the plane that we were supposed to go on, we were going on. The people that supposed to pay their full fare. Us, we pay half fare.  {And that lady} The people that on the plane they told us maybe tomorrow they'll have two seats. And when we called, we told her, "It's all right, we can go anytime." {So she} Next day thereʼs only one seat available and I said, "Go ahead, Iʼm going to wait. I'll have my Mrs. travel first." And she did. The next day we got another seat available and that's it.  Then we go on down to Seattle. And from Seattle we ministered to people there in Seattle. The people that Andy knows, we went to his church and we ministered some people. Sometimes with singing and then we turned it over to them. Sometimes Andy (Anderson???) ministers to them. All the way, sometimes we go for two weeks from Seattle to Arizona. The good miracle that took place was when we were going to Arizona. There was a car coming towards us. Andy, like he's crazy, you know. He came from behind, alongside, we saw the car go speeding. {And when} "Look, look, look," was all he said. And we said, "Jesus." We don't know how we got ahead of that truck. The lord just picked it up I guess, to put it ahead, the car that we're on.

