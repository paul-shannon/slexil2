  - lineNumber: 93
    startTime: 562340
    endTime: 655288
    utterance: And then we, after we come back we go to Kake. When they call us well, we go to the place where they call us to minister to people. One, almost the last time we traveled, we traveled from here.  The plane stopped in Ketchikan and, uh, Beth, she knew friends in Ketchikan and that young girl, when she closed the door, she closed the door on her jacket and the car driver didn't see her. After she, after they drug her, this friend of Beth's was telling her,

