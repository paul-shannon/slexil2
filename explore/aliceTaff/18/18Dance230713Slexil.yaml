  - lineNumber: 97
    startTime: 403400
    endTime: 406614
    utterance: Ḵúnáx̱ Lingít atx̱aayí dux̱áa nooch
    translation: They would eat real Tlingit food

  - lineNumber: 98
    startTime: 406814
    endTime: 412830
    utterance: tsu adul'eix̱ a ítdáx̱.
