  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Aan Yax Saxeex June Pegues and Sakaayí Anita
    Lafferty. Recorded June 2009, in Egan Library at the University of
    Alaska Southeast, Juneau, Alaska, by Kʼyuuhlgaansii Fred Olsen in
    cooperation with Goldbelt Heritage Foundation.  This recording
    documents conversational use of the verb -lʼéix̱, ʼdanceʼ.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Tlingit transcription by Naakil.aan Mark Hans Chester. English
    translation by Shakwshaaní Margaret Dutson with Ljáaḵkʼ Alice
    Taff.  Edited by X̱ʼaagi Sháawu Keri Eggelston and Ḵaachkoo.aaḵw
    Helen Sarabia.
    </div>"

  - lineNumber: 3
    startTime: 2351
    endTime: 3270
    utterance: Jíx̱alwách.
    translation: I shake my hands.

  - lineNumber: 4
    startTime: 3470
    endTime: 5000
    utterance: [At shooḵ]
    translation: [Laughter]

  - lineNumber: 5
    startTime: 5200
    endTime: 7559
    utterance: Tatgé gé iyal'eix̱?      
    translation: Did you dance yesterday?

  - lineNumber: 6
    startTime: 7759
    endTime: 9225
    utterance: Tléik'.
    translation: No.

  - lineNumber: 7
    startTime: 9425
    endTime: 15300
    utterance: Tlél x̱wasakú áa yaa at yanaxíxi ANB Hall.
    translation: I didn't know there was something going on at the ANB Hall.

  - lineNumber: 8
    startTime: 15500
    endTime: 19855
    utterance: Ḵúnáx̱ háa adul'eix̱.
    translation: They were really dancing.

  - lineNumber: 9
    startTime: 20055
    endTime: 25244
    utterance: Ch'a yeisú haat ḵux̱waatín, ách áwé {tlél} tlél x̱wasakú.
    translation: I didn't know because I just came.

  - lineNumber: 10
    startTime: 25444
    endTime: 26858
    utterance: Tlél i een kawduneek?   
    translation: They didn't tell you?

  - lineNumber: 11
    startTime: 27058
    endTime: 28504
    utterance: Hél ax̱ een kawduneek.
    translation: They didn't tell me.

  - lineNumber: 12
    startTime: 28704
    endTime: 32948
    utterance: Ḵúnáx̱ x̱áa woogei wé al'eix̱.
    translation: There was a lot of dances.

  - lineNumber: 13
    startTime: 33148
    endTime: 35966
    utterance: Ldakát ḵáa áwé al'eix̱.
    translation: Everyone was dancing.

  - lineNumber: 14
    startTime: 36166
    endTime: 41374
    utterance: Kaagwaantaan yádi daatx̱ at dusheeyí áwé kei x̱dahánch,
    translation: If they sing a song to the children of the Kaagwaantaan I usually stand to dance,

  - lineNumber: 15
    startTime: 41574
    endTime: 45073
    utterance: ch'a g̱unáa ax̱ keey néegu,
    translation: even with my knee hurting,

  - lineNumber: 16
    startTime: 45273
    endTime: 47903
    utterance: ax̱ tuwáa ḵ'asigóo.
    translation: it makes me happy.

  - lineNumber: 17
    startTime: 48103
    endTime: 49540
    utterance: Há, yéi x̱áawé haa yatee.
    translation: Indeed, this is our life.

  - lineNumber: 18
    startTime: 49740
    endTime: 56244
    utterance: X̱at ḵu.aa, T'aḵdeintaan yádi kát jix̱wálxwalch alʼéix̱ teen.   
    translation: Myself therefore, when dancing, I shake my hands to the song where children of the T'aḵdeintaan are sung about.

  - lineNumber: 19
    startTime: 56444
    endTime: 59059
    utterance: Ax̱ léelk'w hás áwé gé wa.é?
    translation: Are you my grandfather's people?

  - lineNumber: 20
    startTime: 59259
    endTime: 60465
    utterance: Aaá.
    translation: Yes.

  - lineNumber: 21
    startTime: 60470
    endTime: 65966
    utterance: Ax̱ éesh, T'aḵdeintaan yádix̱ woositee.
    translation: My father was a child of the T'aḵdeintaan.

  - lineNumber: 22
    startTime: 66166
    endTime: 73262
    utterance: Kaagwaantaan, {sheet'} Sheet'kaadáx̱.
    translation: A Sitka Kaagwaantaan.

  - lineNumber: 23
    startTime: 73462
    endTime: 77325
    utterance: Kaagwaantaan yádi daatx̱ adisheeyí,
    translation: When they sing a song about children of the Kaagwaantaan,

  - lineNumber: 24
    startTime: 77330
    endTime: 79614
    utterance: kei x̱dahánch,
    translation: I usually stand up and dance,

  - lineNumber: 25
    startTime: 79814
    endTime: 81911
    utterance: ḵa,
    translation: and,

  - lineNumber: 26
    startTime: 82111
    endTime: 83958
    utterance: yeedát ḵu.aa,
    translation: now though,

  - lineNumber: 27
    startTime: 84158
    endTime: 86282
    utterance: aadéi kḵwasa.aax̱
    translation: I will listen

  - lineNumber: 28
    startTime: 86482
    endTime: 92304
    utterance: {da ta} T'aḵdeintaan dachx̱án,
    translation: Grandchild of the T'aḵdeintaan,

  - lineNumber: 29
    startTime: 92504
    endTime: 94021
    utterance: i dachx̱án así?
    translation: am I your grandchild?

  - lineNumber: 30
    startTime: 94030
    endTime: 98670
    utterance: Aaá.
    translation: Yes.

  - lineNumber: 31
    startTime: 98870
    endTime: 103710
    utterance: Ḵushtuyax̱ x̱á akát yil'eix̱í, wa.é tsú T'aḵdeintaan dachx̱ánx̱ isateeyí.
    translation: It's ok for you to dance even when you are the grandchild of the T'aḵdeintaan.

  - lineNumber: 32
    startTime: 103720
    endTime: 108818
    utterance: Tle át kuḵashk'éin, ha.é!
    translation: Then I will jump around, too much!

  - lineNumber: 33
    startTime: 109018
    endTime: 115392
    utterance: Yéi áwé, ax̱ tóodei yaa shoonaxíx, neekw.
    translation: This is all I have.

  - lineNumber: 34
    startTime: 115592
    endTime: 119151
    utterance: Ax̱ yáa ḵut woonéi.
    translation: [???]

  - lineNumber: 35
    startTime: 119351
    endTime: 124780
    utterance: Aadéi has awshigóogu yé {haa} haa yátx'i,
    translation: How our children learned,

  - lineNumber: 36
    startTime: 124790
    endTime: 127855
    utterance: haa dachx̱ánk'i yán,
    translation: all of our grandchildren,

  - lineNumber: 37
    startTime: 128055
    endTime: 132688
    utterance: has awsikóo aadéi yaa at yanaxíx yé.
    translation: they know what's going on.

  - lineNumber: 38
    startTime: 132888
    endTime: 136966
    utterance: X̱áach ḵwá, tlél ldakát x̱wasakú.
    translation: As for me, I don't know it all.

  - lineNumber: 39
    startTime: 137166
    endTime: 143114
    utterance: Tléil atóox̱ kei áx̱ wuduswáat, ách áwé.
    translation: They didnʼt bring me up in it there, that's why.

  - lineNumber: 40
    startTime: 143314
    endTime: 149874
    utterance: Tle ch'a ax̱ shaaní tsá,
    translation: Only in my old age, 

  - lineNumber: 41
    startTime: 150074
    endTime: 159114
    utterance: yei nax̱shagóok haa ḵusteeyí, ch'a yéi googéink'.
    translation: am I learning just a little of our way of life.

  - lineNumber: 42
    startTime: 159314
    endTime: 160948
    utterance: Yak'éi.
    translation: Which is fine.

  - lineNumber: 43
    startTime: 161148
    endTime: 163818
    utterance: Yéi hás gusgéiyi wé yak'éi at yátx'i,
    translation: It's really good when the children are small,

  - lineNumber: 44
    startTime: 164018
    endTime: 166800
    utterance: has du éex̱ adooltóowu
    translation: to be taught

  - lineNumber: 45
    startTime: 167000
    endTime: 170225
    utterance: haa sheex'í ḵa haa l'eix̱x'í.
    translation: our songs and dances.

  - lineNumber: 46
    startTime: 170425
    endTime: 174096
    utterance: A tóox̱ kéi has woowaadí áwé yak'éi.
    translation: It's good when they are brought up in it.

  - lineNumber: 47
    startTime: 174296
    endTime: 179855
    utterance: X̱at áyá x̱at wootee a tóox̱ kéi haa wawát al'eix̱ ḵa at shí.
    translation: This is how it was with me, I was brought up with songs and dance.

  - lineNumber: 48
    startTime: 180055
    endTime: 183392
    utterance: Tlákw ḵoo.éex'dei yaa ktoo.átjin
    translation: We went to ḵoo.éex' at all times

  - lineNumber: 49
    startTime: 183592
    endTime: 188133
    utterance: ák.wé adul'eix̱ noojéen.
    translation: and then they used to dance.

  - lineNumber: 50
    startTime: 188333
    endTime: 191948
    utterance: Haa éesh daat tlákw shukandushéich.
    translation: And they would sing about our fathers. [All songs are sung to the opposite moiety]

  - lineNumber: 51
    startTime: 192148
    endTime: 197651
    utterance: Aag̱áa áwé atool'eix̱ nuch yuháan tsú.
    translation: And then we would always dance too.

  - lineNumber: 52
    startTime: 197851
    endTime: 201688
    utterance: Ax̱ dachx̱ánk'i yán,
    translation: All my grandchildren,

  - lineNumber: 53
    startTime: 201888
    endTime: 209114
    utterance: {ax̱} has du saayí,
    translation: their names,

  - lineNumber: 54
    startTime: 209314
    endTime: 211299
    utterance: tle yeedát tsá
    translation: only recently

  - lineNumber: 55
    startTime: 211499
    endTime: 213730
    utterance: has du yaadéix̱ wli.át
    translation: I gave them

  - lineNumber: 56
    startTime: 213740
    endTime: 217596
    utterance: has {has} du saayí.
    translation: their names.

  - lineNumber: 57
    startTime: 217796
    endTime: 223262
    utterance: Ḵúnáx̱ has du tuwáa sigóo
    translation: They surely like

  - lineNumber: 58
    startTime: 223462
    endTime: 228374
    utterance: haa Lingít ḵusteeyí.
    translation: our Tlingit way of life.

  - lineNumber: 59
    startTime: 228574
    endTime: 241837
    utterance: {tlei} Tlei yéi ax̱ yát has uwan.áx̱. [uwa.át (Nora Dauenhauer)]
    translation: They came to face me.

  - lineNumber: 60
    startTime: 242037
    endTime: 252207
    utterance: Aadéi has du tuwáa ḵ'asigóo.
    translation: How happy they were.

  - lineNumber: 61
    startTime: 252407
    endTime: 264577
    utterance: Kax̱waa.áaḵw has du ée x̱latóowu.
    translation: I tried to teach them.

  - lineNumber: 62
    startTime: 264777
    endTime: 270670
    utterance: Yeedát, neil ḵux̱aateení tsá,
    translation: Now, when I travel home

  - lineNumber: 63
    startTime: 270870
    endTime: 273837
    utterance: tsu kakḵwa.áaḵw
    translation: I will try again

  - lineNumber: 64
    startTime: 274037
    endTime: 276713
    utterance: {daa} ch'a daa sás du ée x̱latóowu
    translation: whatever I teach

  - lineNumber: 65
    startTime: 276913
    endTime: 279366
    utterance: ax̱ dachx̱ánk'i yán.
    translation: to my grandchildren.

  - lineNumber: 66
    startTime: 279566
    endTime: 289188
    utterance: Seattlex' yéi has yatee.
    translation: They live in Seattle.

  - lineNumber: 67
    startTime: 289388
    endTime: 291577
    utterance: Du éen kakḵwanéek
    translation: I am going to tell

  - lineNumber: 68
