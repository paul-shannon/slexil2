    translation: and maybe even your clan songs

  - lineNumber: 90
    startTime: 377740
    endTime: 380580
    utterance: aag̱áa tsá s du jeedéi ách akg̱eesawóo.
    translation: then you will send it to them.

  - lineNumber: 91
    startTime: 380590
