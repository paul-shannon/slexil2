  - lineNumber: 70
    startTime: 299981
    endTime: 304392
    utterance: {tlél} Tlél yéi x̱wsakóowun
    translation: I didn't know this well

  - lineNumber: 71
    startTime: 304592
    endTime: 309262
    utterance: haa Lingít aayí teeyi Seattle.
