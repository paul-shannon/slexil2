  - lineNumber: 72
    startTime: 309462
    endTime: 311540
    utterance: Hél yéi x̱wsakóo.
    translation: I didn't know it.

  - lineNumber: 73
    startTime: 311740
    endTime: 320374
    utterance: {wóosh teen} Woosh x̱ánx̱ has da.aadí.
    translation: That they all get together with each other.

  - lineNumber: 74
    startTime: 320574
    endTime: 325966
    utterance: Ḵúnáx̱ {yéi} yéi ḵustí áwé.
    translation: It's that type of living.

  - lineNumber: 75
    startTime: 326166
    endTime: 328762
    utterance: Haa dachx̱ánx'i yán
    translation: Our grandchildren

  - lineNumber: 76
    startTime: 328962
    endTime: 330688
    utterance: hásch tsú
    translation: they too

  - lineNumber: 77
    startTime: 330888
    endTime: 333911
    utterance: sh tóo has at g̱altóow.
    translation: will study our way of life.

  - lineNumber: 78
    startTime: 334111
    endTime: 335948
    utterance: Yak'éi x̱áawé!
    translation: That is good!

  - lineNumber: 79
    startTime: 336148
    endTime: 339577
    utterance: Ḵúnáx̱ at yátx'i éex' áwé át dultóow Seattle.
    translation: They're teaching children in Seattle.

  - lineNumber: 80
    startTime: 339777
    endTime: 341762
    utterance: Tlákw adul'eix̱ nooch.
    translation: They always dance.

  - lineNumber: 81
    startTime: 341962
    endTime: 346411
    utterance: Ḵa s at shée nooch.
    translation: And they would sing too.

  - lineNumber: 82
    startTime: 346611
    endTime: 351411
    utterance: Tle Lingít saayí tsú wé jeedé has al.át.
    translation: They're also giving each other Tlingit names.

  - lineNumber: 83
    startTime: 351611
    endTime: 354781
    utterance: Aag̱áa ḵúnáx̱ adul'ex̱ nooch.
    translation: And then they would really dance.

  - lineNumber: 84
    startTime: 354981
    endTime: 358133
    utterance: K'idéin yaa s anaskwéin.
    translation: They are learning well.

  - lineNumber: 85
    startTime: 358333
    endTime: 364960
    utterance: I dachx̱ánx'i yán ax̱óot has woo.aadí áwé kei kg̱wak'éi.
    translation: When your grandchildren go and join them it will be nice.

  - lineNumber: 86
    startTime: 365160
    endTime: 367614
    utterance: Yeedát tsú atóodéi yóo x̱'ax̱wdiwatángi át
    translation: And now with the telephones

  - lineNumber: 87
    startTime: 367814
    endTime: 370003
