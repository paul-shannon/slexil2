  - lineNumber: 94
    startTime: 392203
    endTime: 397559
    utterance: Tlákw wooch g̱unéit ḵundutínch al'eix̱ yís.
    translation: They often get together to dance.

  - lineNumber: 95
    startTime: 397759
    endTime: 400188
    utterance: Ch'a g̱oot yéix' adul'ex̱ nooch.
    translation: People from Seattle always dance in different places.

  - lineNumber: 96
    startTime: 400388
    endTime: 403390
    utterance: Ag̱áa tsú adux̱áa nooch!
