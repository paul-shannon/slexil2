  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Kaaxwaan Éesh George Davis, Ḵaachkoo.aaḵw Helen
    Sarabia, and Naakil.aan Mark Hans Chester. Recorded June, 2009 at
    Egan Library, University of Alaska Southeast, in Juneau, Alaska,
    by Ljáaḵkʼ Alice Taff.  This recording documents conversational
    use of the verb √x̱aa, 'eat'.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Tlingit transcription by Naakil.aan Mark Hans Chester. English
    translation by Shákwsháani Margaret Dutson and LjáaḵkʼAlice
    Taff. Edited by X̱ʼaagi Sháawu Keri Edwards and Ḵaachkoo.aaḵw Helen
    Sarabia.
    </div>"

  - lineNumber: 3
    startTime: 62
    endTime: 1910
    utterance: Decaf áwé ax̱diná, ách áyú.
    translation: That's why I drink decaf.

  - lineNumber: 4
    startTime: 2110
    endTime: 5232
    utterance: Oh. Ax̱ téix̱' áwé ootsínch.  Aaá.
    translation: My heart comes alive. [speeds up]

  - lineNumber: 5
    startTime: 5432
    endTime: 8180
    utterance: Yéi daak yéi x̱at yawsiḵaa
    translation: The doctor said to me

  - lineNumber: 6
    startTime: 8380
    endTime: 10690
    utterance: decaf áwé kg̱eedanáa.
    translation: you are going to drink decaf.

  - lineNumber: 7
    startTime: 10701
    endTime: 13501
    utterance: [At shooḵ]
    translation: [Laughter] 

  - lineNumber: 8
    startTime: 13701
    endTime: 15664
    utterance: Yéi á!
    translation: This is the way it is!

  - lineNumber: 9
    startTime: 15864
    endTime: 17980
    utterance: Dawóotl áwé yaa ndashán.
    translation: It's difficult getting old.

  - lineNumber: 10
    startTime: 18180
    endTime: 25290
    utterance: [At shooḵ]  Ha.é! 
    translation: Laughter]  Too much!

  - lineNumber: 11
    startTime: 25490
    endTime: 26980
    utterance: Yéi s x̱'ax̱a.áx̱jin nujéen,
    translation: I used to hear them say that,

  - lineNumber: 12
    startTime: 27180
    endTime: 28510
    utterance: ax̱ léelk'w hás,
    translation: my grandparents,

  - lineNumber: 13
    startTime: 28710
    endTime: 31000
    utterance: «Yaa indashán óosh dei chx̱ánk'.»
    translation: "If only you are getting old, grandchild."

  - lineNumber: 14
    startTime: 31200
    endTime: 31810
    utterance: Aaá.
    translation: Yeah.

  - lineNumber: 15
    startTime: 32010
    endTime: 33450
    utterance: Yeedát áwé haa éet ḵuwaháa!
    translation: And now it's our turn now!

  - lineNumber: 16
    startTime: 33650
    endTime: 37280
    utterance: Aaá. [At shooḵ]
    translation: Yes. [Laughter]

  - lineNumber: 17
    startTime: 37290
    endTime: 38500
    utterance: Eesháan yaa ndashán!
    translation: It's tough getting old!

  - lineNumber: 18
    startTime: 38700
    endTime: 42637
    utterance: Eesháan!
    translation: Poor thing!

  - lineNumber: 19
    startTime: 42837
    endTime: 45230
    utterance: Goodéi sáyá kax̱wlitsaaḵ?
    translation: Where did I stuff it?

  - lineNumber: 20
    startTime: 45240
    endTime: 48180
    utterance: Laaḵ'ásk gé eex̱á George?
    translation: George, do you eat black seaweed?

  - lineNumber: 21
    startTime: 48380
    endTime: 49570
    utterance: Aaá.
    translation: Yes.

  - lineNumber: 22
    startTime: 49770
    endTime: 52313
    utterance: I x̱'éit gé yak'éi?
    translation: Does it taste good to you?

  - lineNumber: 23
    startTime: 52513
    endTime: 53651
    utterance: Éisk'!  Linúkwts!
    translation: It's delicious!  It's sweet to me!

  - lineNumber: 24
    startTime: 53851
    endTime: 56124
    utterance: Aaá.
    translation: Yes.

  - lineNumber: 25
    startTime: 56324
    endTime: 59920
    utterance: Kḵwax̱áa.
    translation: I'll eat some.

  - lineNumber: 26
    startTime: 60120
    endTime: 65460
    utterance: A g̱áa yóo tooḵóox̱'gun.  Boy!
    translation: We used to go after them.  Boy!

  - lineNumber: 27
    startTime: 65824
    endTime: 66840
    utterance: Laaḵ'ásk gé?
    translation: Is this black seaweed?

  - lineNumber: 28
    startTime: 67040
    endTime: 68867
    utterance: Aaá. 
    translation: Yes.

  - lineNumber: 29
    startTime: 69067
    endTime: 72322
    utterance: Way outside.

  - lineNumber: 30
    startTime: 72522
    endTime: 73520
    utterance: Ax̱ tláach áwé
    translation: My mother

  - lineNumber: 31
    startTime: 73720
    endTime: 75790
    utterance: yéi awsinéi wé laaḵ'ásk
    translation: picked the black seaweed

  - lineNumber: 32
    startTime: 75990
    endTime: 79583
    utterance: ḵa ḵ'áach', Yaakwdaatx'.
    translation: and ribbon seaweed too, in Yakutat.

  - lineNumber: 33
    startTime: 79783
    endTime: 81840
    utterance: Uháan tsú.
    translation: Us too.

  - lineNumber: 34
    startTime: 82040
    endTime: 83950
    utterance: K'idéin awax̱áa,
    translation: She ate it well

  - lineNumber: 35
    startTime: 84150
    endTime: 87570
    utterance: wé du dachx̱ánk',
    translation: her little granddaughter,

  - lineNumber: 36
    startTime: 87770
    endTime: 90597
    utterance: {tléil} tléil uwaxúk dei! [Tlél uxóokch yeisú]
    translation: and it wasn't dry yet!

  - lineNumber: 37
    startTime: 90797
    endTime: 94580
    utterance: Ch'a yéi áwé du tuwáa sigóo aawax̱áa. [or: ax̱aayí]
    translation: That's just how much she likes to eat it!  (She eats it anyway!  

  - lineNumber: 38
    startTime: 94780
    endTime: 97475
    utterance: Ch'a tlákw atx̱á [or: ax̱áa] nooch wé laaḵ'ásk.
    translation: She always eats black seaweed.

  - lineNumber: 39
    startTime: 97675
    endTime: 100272
    utterance: Tléil, wáa sá duwasáakw?
    translation: It's not, what is that called?

  - lineNumber: 40
    startTime: 100472
    endTime: 104529
    utterance: X̱at tsú ax̱ dachx̱ánx'i yán ax̱ {ax̱ x̱ánt} x̱ánt has woo.aadí
    translation: Me too, when my grandchildren come by me

  - lineNumber: 41
    startTime: 104729
    endTime: 110340
    utterance: fridgedei (analg̱éin)  fridge é, ch'u tlei.
    translation: then they looked in the fridge.

  - lineNumber: 42
    startTime: 110540
    endTime: 114259
    utterance: Has du tuwáa sigóowu át.
    translation: What they really like.

  - lineNumber: 43
    startTime: 114459
    endTime: 120637
    utterance: Ch'a x̱at ax̱ aayí áwé ch'a g̱oot yéix'.
    translation: My food is in a separate place.

  - lineNumber: 44
    startTime: 120837
    endTime: 127232
    utterance: Ax̱ tuwáa sigóo {s} has du tuwáa sigoowú wé Lingít at x̱aayí ax̱ dachx̱ánx'i yán.
    translation: I'm glad that my grandchildren like Tlingit foods.

  - lineNumber: 45
    startTime: 127432
    endTime: 129274
    utterance: Starting with 1, of course.

  - lineNumber: 46
    startTime: 129290
    endTime: 129960
    utterance: Tléik'.
    translation: No.

  - lineNumber: 47
    startTime: 129970
    endTime: 133313
    utterance: Daa sáwé eex̱á, yaa yeedát?
    translation: What are you eating now?

  - lineNumber: 48
    startTime: 133513
    endTime: 135220
    utterance: Sakwnéin áwé yax̱ x̱ax̱á.
    translation: I'm eating like, bread.

  - lineNumber: 49
    startTime: 135420
    endTime: 136890
    utterance: Éis'k'!  Gax̱toosáa.
    translation: Delicious!  We will name it??

  - lineNumber: 50
    startTime: 136900
    endTime: 138340
    utterance: Dleit ḵáa sakwnéin.
    translation: White man's bread.

  - lineNumber: 51
    startTime: 138540
    endTime: 141894
    utterance: Aaá.
    translation: Yes.

  - lineNumber: 52
    startTime: 142094
    endTime: 143813
    utterance: X̱'ég̱aa yak'éi.
    translation: It's truly good.

  - lineNumber: 53
    startTime: 144013
    endTime: 145161
    utterance: Linúkdzi sakwnéin. 
    translation: Sweet bread. 

  - lineNumber: 54
    startTime: 145361
    endTime: 146732
    utterance: Linúkts! ???
    translation: Real sweet!

  - lineNumber: 55
    startTime: 146932
    endTime: 150313
    utterance: Mmm.

  - lineNumber: 56
    startTime: 150513
    endTime: 154495
    utterance: Wuditláx̱ áwé Lingít atx̱aayí tléil eex̱áaḵ.
    translation: Don't eat the Tlingit food that is moldy.

  - lineNumber: 57
    startTime: 154504
    endTime: 155209
    utterance: Mmm.

  - lineNumber: 58
    startTime: 155409
    endTime: 159740
    utterance: Kei ikg̱wanéekw!
    translation: You will get sick!

  - lineNumber: 59
    startTime: 159940
    endTime: 161200
    utterance: Ha.é!
    translation: Too much!

  - lineNumber: 60
    startTime: 161400
    endTime: 165029
    utterance: Ha.é!
    translation: Too much!

  - lineNumber: 61
    startTime: 165229
    endTime: 170300
    utterance: Wé chatl x̱'éeshi gé i x̱'éit yak'éi?
    translation: Do you like dried halibut?

  - lineNumber: 62
    startTime: 170500
    endTime: 173394
    utterance: Ḵúnáx̱!
    translation: Very much!

  - lineNumber: 63
    startTime: 173594
    endTime: 176710
    utterance: Ch'a tlákw áwé wutoox̱áa nooch, at yátx'i [or: At yátx'i yáx̱ áwé toox̱áa nooch].
    translation: As children we always would eat it.

  - lineNumber: 64
    startTime: 176910
    endTime: 182327
    utterance: {wé} Kei nx̱wawaadí [kei ax̱ nawádi] wé at x̱éeshi ax̱ tláach awa.óo.
    translation: And growing up my mother bought dry fish.

  - lineNumber: 65
    startTime: 182527
    endTime: 183150
    utterance: Éis'k'!
    translation: Delicious!

  - lineNumber: 66
    startTime: 183350
    endTime: 184630
    utterance: Yaakwdaatdáx̱.
    translation: From Yakutat.

  - lineNumber: 67
    startTime: 184905
    endTime: 190600
    utterance: Back seat, Back seatx' {yéi x̱waa} yéi x̱waanóok.
    translation: I sat in the back seat.

  - lineNumber: 68
    startTime: 190800
    endTime: 193910
    utterance: Ch'a ldakát át áwé x̱waax̱áa!
    translation: I ate different things!

  - lineNumber: 69
    startTime: 194110
    endTime: 196908
    utterance: «Ha.éi!  Ilí, ilí ,» yéi yawaḵáa ax̱ tláa.  
    translation: "Too much!   Stop, stop it," my mother said.

  - lineNumber: 70
    startTime: 197108
    endTime: 198759
    utterance: «Haa x̱'éis aa yéi na.oo!» 
    translation: "I'm buying it for us to eat!" [Kaachkoo.aaḵw speaking as the mother.]

  - lineNumber: 71
    startTime: 198959
    endTime: 199990
    utterance: «Haa at x̱aayí áwé! 
    translation: That's our food!

  - lineNumber: 72
    startTime: 200190
    endTime: 201040
    utterance: Wáanáx̱ sáwé
    translation: Why are you

  - lineNumber: 73
    startTime: 201240
    endTime: 204020
    utterance: ch'a ldakát át eex̱á wé at x̱'éeshi?»
    translation: always eating everything, and the dry fish?"

  - lineNumber: 74
    startTime: 204220
    endTime: 207972
    utterance: «Ch'a ax̱ tuwáa sigóo,» yéi yax̱waakáa.
    translation: I just like it, I said.

  - lineNumber: 75
    startTime: 208009
    endTime: 216259
    utterance: [At shooḵ]
    translation: [Laughter]

  - lineNumber: 76
    startTime: 216459
    endTime: 217540
    utterance: Laaḵ'ásk tsú
    translation: Also black seaweed,

  - lineNumber: 77
    startTime: 217740
    endTime: 220120
    utterance: ch'a ldakát haa Lingít at x̱aayí áwé
    translation: just all kinds of our Tlingit foods

  - lineNumber: 78
    startTime: 220320
    endTime: 221372
    utterance: Yaakwdaatdáx̱.
    translation: were from Yakutat.

  - lineNumber: 79
    startTime: 221385
    endTime: 223138
    utterance: Éitsk!
    translation: Yum!

  - lineNumber: 80
    startTime: 223338
    endTime: 224420
    utterance: Haa x̱oonx'í yán
    translation: Our relatives

  - lineNumber: 81
    startTime: 224620
    endTime: 227218
    utterance: haa jeet has kawdiháa wé [or: haa jeet has aawawóo]
    translation: sent us

  - lineNumber: 82
    startTime: 227418
    endTime: 231813
    utterance: at x̱aayí.
    translation: food.

  - lineNumber: 83
    startTime: 232013
    endTime: 237259
    utterance: Yix̱ á gé Lingít at x̱aayí?
    translation: Do you eat Tlingit foods?

  - lineNumber: 84
    startTime: 237459
    endTime: 239745
    utterance: Next one.

  - lineNumber: 85
    startTime: 239945
    endTime: 241029
    utterance: Yix̱á,
    translation: You eat,

  - lineNumber: 86
    startTime: 241229
    endTime: 245272
    utterance: Yix̱á gé Lingít at x̱aayí?
    translation: Do you eat Tlingit foods?

  - lineNumber: 87
    startTime: 245472
    endTime: 249310
    utterance: X̱'ax̱waanáḵ Lingít at x̱aayí.
    translation: I stopped eating Tlingit foods.

  - lineNumber: 88
    startTime: 249333
    endTime: 253309
    utterance: [At shooḵ] [He just said that to get the verb form on the recording.]
    translation: [Laughter]

  - lineNumber: 89
    startTime: 253509
    endTime: 258462
    utterance: Yeedát áwé recordx̱ haa doolyéx̱ tle ax̱ toowú kútx̱ x̱waag̱éex'.
    translation: Now that we are being recorded I've lost my mind.

  - lineNumber: 90
    startTime: 258662
    endTime: 261050
    utterance: Yáa atx̱á gé wé yéi x̱at ya.óo.
    translation: Maybe it's this food that makes me that way.

  - lineNumber: 91
    startTime: 261250
    endTime: 265824
    utterance: Kḵwax̱áa x̱á.
    translation: I'll surely eat it.

