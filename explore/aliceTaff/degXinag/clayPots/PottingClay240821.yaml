lines:

  - html: "<div style='margin: 30px; margin-left: 50px; margin-right: 100px;'>
       Ethok Łats. Potting Clay. Told by Edna Deacon at the home of
       Alta Jerue in Anvik, AK, October 2002.
       </div>"

  - html: "<div style='margin: 30px; margin-left: 50px; margin-right: 100px;'>
       Translated by Edna Deacon, Donna Miller MacAlpine, and Alice
       Taff. Transcribed by Donna Miller MacAlpine and Alice Taff with
       Edna Deacon.
       </div>"


  - lineNumber: 3
    startTime: 5920
    endTime: 10210
    utterance: Istl'idong sito',
    translation: When I was small, my father,

  - lineNumber: 4
    startTime: 10220
    endTime: 20810
    utterance: "Gan iy ethok łats?" viditlqit.
    translation: "What is potting clay?" I ask him.

  - lineNumber: 5
    startTime: 21130
    endTime: 48980
    utterance: And he say, ah, "That's what they make pot out of," he tell me.  I tell him, "What kind of pot?" "Ethok,"  he said, "cooking pot." Then I want to know how they mix it, to make it into a pot.

  - lineNumber: 6
    startTime: 51546
    endTime: 58469
    utterance: "Gitth'ithgi vitux dalyayh," ne sito'.
    translation: "(With) feathers in it they mix it," says my father.

  - lineNumber: 7
    startTime: 58669
    endTime: 64533
    utterance: And, naghixiyinitłtth'inh.
    translation: And they knead it.

  - lineNumber: 8
    startTime: 64733
    endTime: 66896
    utterance: Like a bread dough.

  - lineNumber: 9
    startTime: 67096
    endTime: 70984
    utterance: Naghixiyinitltth'inh and then,
    translation: they knead it and then,

  - lineNumber: 10
    startTime: 71184
    endTime: 72500
    utterance: (AJ) Really knead it.

  - lineNumber: 11
    startTime: 72700
    endTime: 77211
    utterance: (ED) Yeah, they knead it.

  - lineNumber: 12
    startTime: 77411
    endTime: 94480
    utterance: But I didn't ask him what kind of feathers they put in there.  It's just, ah, grouse feathers, I think. And it have to be just right feathers in there, he said.

  - lineNumber: 13
    startTime: 94638
    endTime: 98404
    utterance: Iy gitth'ithgi vitux dalyayh.
    translation: Those feathers among it they mix it.

  - lineNumber: 14
    startTime: 98477
    endTime: 103166
    utterance: And, naghxiyintltth'inh.
    translation: Kneading it into it.

  - lineNumber: 15
    startTime: 103375
    endTime: 105790
    utterance: Xidigał xełedz xineyh,
    translation: Finally it's good.

  - lineNumber: 16
    startTime: 105794
    endTime: 110834
    utterance: Meaning it turn just good, just right to make the pot. Then they start forming,

  - lineNumber: 17
    startTime: 114910
    endTime: 119490
    utterance: viye givatr iy, pot.
    translation: a pot. [Lit. in it, it cooks]

  - lineNumber: 18
    startTime: 119557
    endTime: 125351
    utterance: Ingtthaq xeyitl'onh.
    translation: They put it by the fire (to keep it warm).

  - lineNumber: 19
    startTime: 125387
    endTime: 127730
    utterance: Gits'an xiyiłghith,
    translation: They turn it

  - lineNumber: 20
    startTime: 127740
    endTime: 136065
    utterance: meaning they turn it "gits'an" this way by hand and they have something straight to keep,
    translation: ...around (turn)...

  - lineNumber: 21
    startTime: 136265
    endTime: 162603
    utterance: (AJ) Yeah, they use a little paddle and as they turn it they pat it flat so it won't, you know, get out of shape, or something.  She said she didn't watch her do it. She didn't watch her doing it. She was doing it outdoors. She had a little fire outdoors.

  - lineNumber: 22
    startTime: 162803
    endTime: 190973
    utterance: (ED) Then after while when I wanted to know more about it, he said I talk too much.  My dad tell me I talk too much so I have to quit. But I know it's that ethok łats, the mud that's used to make a cooking pot.
    translation: … potting clay…

  - lineNumber: 23
    startTime: 191213
    endTime: 194565
    utterance: (AJ) Oh, and where he got the mud from?

  - lineNumber: 24
    startTime: 194765
    endTime: 201451
    utterance: (ED) It's somewhere Innoko River or they came out on the Yukon to get it.

  - lineNumber: 25
    startTime: 201651
    endTime: 207789
    utterance: That's what I wanted to know but, he said I was talking too much so I have to quit.

  - lineNumber: 26
    startTime: 213180
    endTime: 225125
    utterance: (AT) Do you want to say the whole thing in deg xiq'i so we can have it all in one piece now?  Say what you just said but without any English to it.
    translation: …the local language…

  - lineNumber: 27
    startTime: 225325
    endTime: 230429
    utterance: Ethok Łats
    translation: Potting Clay

  - lineNumber: 28
    startTime: 230629
    endTime: 238627
    utterance: "Sito', gan iy ethok łats?" vidisne.
    translation: "My father, what is potting clay?" I say to him.

  - lineNumber: 29
    startTime: 238827
    endTime: 244691
    utterance: "Etho yixigheghok, he'?
    translation: "Pots, how they used to make them, eh?

  - lineNumber: 30
    startTime: 244891
    endTime: 247957
    utterance: Etho łats axa," siłne.  
    translation: With potting clay," he tells me.

  - lineNumber: 31
    startTime: 250998
    endTime: 260160
    utterance: Gan sre' di'iłne.
    translation: I don't know what he's telling me.

  - lineNumber: 32
    startTime: 260264
    endTime: 265956
    utterance: "Ethok łats yixeghoyh,
    translation: "They used to make mud pots.

  - lineNumber: 33
    startTime: 266156
    endTime: 271254
    utterance: Yidong dixił'anh," yiłne.
    translation: Long ago they made them," he tells me.

  - lineNumber: 34
    startTime: 271454
    endTime: 280735
    utterance: Ndagh sre' deg Yiqin or edixi. Ndagh sre'.
    translation: Where I don't know, around Yukon or up there (Innoko River). I don't know.

  - lineNumber: 35
    startTime: 280935
    endTime: 283840
    utterance: {yixiz} Nixiyalyayh ts'in'.
    translation: They brought it (the clay) down.

  - lineNumber: 36
    startTime: 284040
    endTime: 286806
    utterance: Gitth'ithgi
    translation: Feathers

  - lineNumber: 37
    startTime: 287006
    endTime: 289773
    utterance: xiy tux ilayh.
    translation: are mixed in.

  - lineNumber: 38
    startTime: 289973
    endTime: 292425
    utterance: Ts'i naghixiyintltth'inh.
    translation: They knead it in.

  - lineNumber: 39
    startTime: 292625
    endTime: 295025
    utterance: Getiy xełedz dineyh tux.
    translation: It's mixed until it’s really nice.

  - lineNumber: 40
    startTime: 295225
    endTime: 298578
    utterance: "Agide.
    translation: "OK.

  - lineNumber: 41
    startTime: 298778
    endTime: 310190
    utterance: Viye givatr iy tr'itiłtse," ne.
    translation: A cooking pot, we'll make," he says.

  - lineNumber: 42
    startTime: 310678
    endTime: 314241
    utterance: "Di ethok xiq'i iy xiłtse,
    translation: "A pot like they made,

  - lineNumber: 43
    startTime: 314441
    endTime: 319698
    utterance: engthe xididhiq'undi xighun'.
    translation: (and put it) down near the fireplace.

  - lineNumber: 44
    startTime: 319898
    endTime: 325440
    utterance: Xits'i xiy di'oyh ts'in',
    translation: By it they put,

  - lineNumber: 45
    startTime: 325459
    endTime: 328369
    utterance: ah, tritr,
    translation: ah, wood,

  - lineNumber: 46
    startTime: 328569
    endTime: 330891
    utterance: dit'its xiy axa.
    translation: flat, by means of it. [The piece of wood is just right to put under the pot.]

  - lineNumber: 47
    startTime: 331091
    endTime: 336563
    utterance: Gits'an xiy do'oł,
    translation: (So you can) move it around (so you don't touch the pot),

  - lineNumber: 48
    startTime: 336763
    endTime: 338980
    utterance: tr'ixeneg ts'i.
    translation: carefully.

  - lineNumber: 49
    startTime: 339180
    endTime: 344760
    utterance: Yuxudz xaxa toggingh'," yiłne.
    translation: Completely that's how it will dry," he says.

  - lineNumber: 50
    startTime: 344960
    endTime: 350372
    utterance: Yuxudz nixał'an iłt'e gits'an xiy do'oł ts'i xidigał,
    translation: All the time they keep doing that until finally,

  - lineNumber: 51
    startTime: 350572
    endTime: 354767
    utterance: yuxudz xaxa diggoyh.
    translation: completely, that's how it dries.

  - lineNumber: 52
    startTime: 354967
    endTime: 361248
    utterance: And your ethok {nn} viq'i elnek.
    translation: And your pot is finished.

