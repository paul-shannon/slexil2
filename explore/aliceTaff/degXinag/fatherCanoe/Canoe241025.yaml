  - html: "<div style='margin: 30px; margin-left: 50px; margin-right: 100px;'>
    Sito' tr'eyh itltsenh. My Father made a canoe. Told by Ellen
    Savage at her home in Anchorage, AK, October 2002. Because she had
    recorded so much that day, Ellen had become hoarse by the time she
    told this history.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 50px; margin-right: 100px;'>
    Recorded by Alice Taff and Donna Miller MacAlpine
    (DMM). Transcribed and translated by Donna Miller MacAlpine, Ellen
    Savage, Edna Deacon, and Alice Taff.
    </div>"

