    translation: [Traditionally said while setting halibut hooks]

  - lineNumber: 118
    startTime: 784405
    endTime: 792817
    utterance: And heʼs catching and so, so they say that a lot and, my other grandson, Steven, would sing it

  - lineNumber: 119
    startTime: 793017
    endTime: 798937
    utterance: «Wéidei yéi jikandagút a káa yishíx,» dux, dux, dux, thatʼs the drum. 
    translation: [Chant traditionally said while setting halibut hooks]

  - lineNumber: 120
    startTime: 799137
    endTime: 879815
    utterance: So they, they really have a lot of fun trying to, trying to learn the language. But I have a hard time because I donʼt know very much now. But um, my mother let me go to my aunt, in Ketchikan, Saxman. She let me, she let my aunt Ida have me. My Aunt Ida lost her son. And I stayed with her for a while and every time I spoke Tlingit they would laugh because the way they, thet talk they like they were start gonna sing, you know. Itʼs um, some of their words were different.  And every time I spoke they would just laugh so I kind of quit talking.  And, and I canʼt understand why thereʼs such a difference in the way we speak with people in Ketchikan and Klawock, so. But we try to learn. We, we  talk back and forth sometimes and we just laugh because it, we, we mispronounce a lot of words I think. But we try.

  - lineNumber: 121
    startTime: 880015
    endTime: 881403
    utterance: You did fine.

  - lineNumber: 122
    startTime: 881603
    endTime: 895477
    utterance: I understand it. I can understand it real good but itʼs so hard to speak it now.

  - lineNumber: 123
    startTime: 895677
    endTime: 956034
    utterance: I noticed our language is uh, itʼs comical when you talk in Tlingit. You just laugh and laugh about, when you learn our language you. Sometimes itʼs not even funny too when you explain it in English but in our language, for some reason, itʼs really comical. And, we always laugh about it. Thereʼs something there but I forgot what somebody was telling and uh, they said when they explain it in English it wasnʼt even funny but when you say it in our language it, you just laugh. So if, and I used to listen to my husbandʼs grandfather, Billy Jones, uh,

  - lineNumber: 124
