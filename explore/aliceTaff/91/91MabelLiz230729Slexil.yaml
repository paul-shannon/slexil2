  - lineNumber: 41
    startTime: 222027
    endTime: 346651
    utterance: We pray about this problem in our village. We pray that something will be done about the problem. Itʼs our future, our future that are getting into stuff that we donʼt like. Itʼs hard on old people like us to see whatʼs happening. And I, I praise the Lord for the way we were taught to respect one another and to show love for one another. As we grew up we were taught to help the elderly. We had to pack water; we had to pack wood; and we, we were told, if you see someone packing water you help them. If you see them packing wood you help them. Donʼt let anybody go without your help, so Iʼm thankful that we were taught this and itʼs gotten away from our people and. It started with people with the tvs, I blame the tvs ʼcause we were taught to work. We had to work. Even when we were small, we were taught to learn how to housekeep. We had to work on wood, packing water. Washing by hand. I still have my washboard. And I, I taught my children, you have to work for a living. You canʼt depend on anybody. So, my family is out, all working. I lost one son. And itʼs really hard. Iʼm thankful for the people of Angoon. 

