  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Kaach Ḵúleixʼ Mabel Jack (Raven, Deisheetaan, Deishú
    Hít, Daḵlʼaweidí Yádi, Aangoon Ḵwáan), Shkanyadaká Elizabeth
    McCluskey (Aandax̱ʼaak Hít), Kaséix̱ Selina Everson (Raven,
    Deisheetaan, Raven House, Angoon, child of the Kaagwaantaan,
    grandaughter of the bear clan Teiḵweidí, Raven/beaver), and
    Shx̱'oosaxws Verna Johnson.  Recorded May 17, 2013, at Admiralty
    Suites, Angoon, AK, by LjáaḵkʼAlice Taff, Caroline Andrews, and
    Liana Wallace.
    </div>"

