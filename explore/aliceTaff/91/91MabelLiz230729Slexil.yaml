    endTime: 958099
    utterance: Laangoosh.oo
    translation: [Billy Jonesʼ name]

  - lineNumber: 125
    startTime: 958299
    endTime: 974151
    utterance: He was uh, in our native I think we used to say, chief or big shot. Heʼd say, he used to really talk about everything.

  - lineNumber: 126
