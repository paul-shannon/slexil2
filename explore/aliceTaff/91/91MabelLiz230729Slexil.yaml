  - lineNumber: 116
    startTime: 751909
    endTime: 778130
    utterance: And sometimes I would say, uh, {my} my grandson, my granddaughter married a Korean and heʼs really anxious to learn how to talk Tlingit. He would say, "Grandma, what do I say when Iʼm gonna go fishing?" "Well, before you throw your fishline in the water, you throw it in the water and you say,

  - lineNumber: 117
    startTime: 778330
    endTime: 784400
