    utterance: Well, the crick that we, where we stayed, we had a, we had a bunkhouse and we had a uh, three level smokehouse. And, uh, one night it was my turn to stoke the smokehouse, the fire. And uh, I fell asleep inside the smokehouse. Then all of a sudden the back, the back wall fell outward with a bear pulling on it. And uh, when I heard the bear growl I was already up on the third level before he could growl the second time. And my uncle, my grandfather, and Uncle Frank Paul, ???, were there and uh, they all came out with rifles and that bear was gone. I mean it didnʼt have a chance with 3 guys. One shot apiece and that bear was down. We donʼt eat, brown bear. I donʼt think anybody here in town eats brown bear either. But uh, they cut it up. They skinned it out. It was a pretty good hide. And I think my grandfather kept it. I donʼt know where they put it or did they give it to somebody; I canʼt remember but they had it for a while. They had it on their bedroom floor.

