    utterance: Speakers are Kaséix̱ Selina Everson, Wooshtudeidu.oo Florence Smarch, Tʼaaḵú Tláa Pearl Keenan, Chukatéen Jane Smarch, Keiyishí Bessie Cooley, and Lasaayí Emma Shorty. Recorded August 13, 2010, at the Teslin Tlingit Heritage Centre, Teslin, YT, Canada, by Ljáaḵkʼ Alice Taff.   

