    endTime: 785998
    utterance: "Iʼll never ever have any wrinkles." Thatʼs what they say. Haam. When they eat, itʼs just like when youʼre reborn and reliving again. You gotta watch what you eat. You put it on that rock and you put it away for the first time you eat it.  Then it piles up here, you take it away and you put it under a big tree. Everything you put it like that and you put it back and you put it in the back part of your head. I think itʼs the most iportant thing in a personʼt life. I know when I was going through that training, I was made to feel that I was, I was, it was really important. It changed my life when I was going through that training period. And the boys, the men were the same way, the boys were.  Itʼs just as I said before; our boys were, when they were 18 years old they were men! Not because they were big as their father or nothing, no. They knew exactly, from their unclesʼ training. And that one too. They used, they used to take the sinew from a, from a sheep or a goat and tie it on them, young boysʼ legs. The uncles would do that. And them boys, they could really travel and do different things.     

