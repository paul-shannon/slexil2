    endTime: 82298
    utterance: I think we should talk about yú chʼáakw yéeyi áyú ḵut wugoodí Lingít, máa sá daadunéiyin.
    translation: I think we should talk about those people in olden times that went into seclusion, what they used to do to them. [lit. ʼhumans that have gotten lost,ʼ maybe a local idiom.]

  - lineNumber: 4
