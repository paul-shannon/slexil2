    endTime: 880195
    utterance: thatʼs what Iʼm going to talk, to let you know. Itʼs proven with us up here in the Yukon, with a, when young girls, when Tlingit women are going to have a baby, it used to be the doctors in Whitehorse, they would go off and woman would come in, the nurse would phone up the doctor and ask, "I think you better come. This certain sure woman is going to have a baby."  And that doctor would say, "Well, where is she from?" And if she said Teslin, well, "Yes, Iʼll be right there," because our women were never 5, 7, 8 hours. Two or three hours, thatʼs all. And after they had the first baby, maybe one hour and they had the baby. And itʼs all planted. When theyʼre adolescent itʼs planted in their mind. Shooting is the same way. Have a crow person holding that gun in their hands, and a knife for youʼre first going to cut anything, you never pick it up and do it. You have to have a crow holding your hand.

