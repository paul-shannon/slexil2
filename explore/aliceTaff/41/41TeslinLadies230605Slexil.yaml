  - lineNumber: 59
    startTime: 496709
    endTime: 562800
    utterance: thatʼs when they would do it. Not to show off, to show off to everybody, then they used to come back and take them back and theyʼd go back to bed. Haam. A lot of our training was very much like the white people do like you know, you plant things in a personʼs mind. Tlingit people, thatʼs the way it was then. With women it was right down to having a baby. Shooting. Sewing. You did everything and you did it well. And patience. You have to have patience. And they learnt ʼem that way by them. When you get the jack pine out there. They used to the pieces of the jack pine brush. And they used to say, "Take it one at a time and pile it up there, neat." Haam, somebody would come say, "Hey, look at this! Somebodyʼs coming!" 

  - lineNumber: 60
    startTime: 563000
    endTime: 565502
    utterance: «G̱anu! Lí!»
    translation: "Sit down! Wait!"

  - lineNumber: 61
    startTime: 565702
    endTime: 580327
    utterance: Youʼre not even supposed to raise your head to look. Haam.There was lots of training for our people and it was most important.

  - lineNumber: 62
