    utterance: Hes du káak used to do it.
    translation: Their maternal uncle used to do it.

  - lineNumber: 47
    startTime: 263608
    endTime: 374516
    utterance: The reason, because they belong to the same clan. Thatʼs why. Haam, when that second world war broke out, in the world, our boys, LOTS of our boys across Canada went. Haam. {They got} They didnʼt want to give it to us, the reputation but, we had the best boys for snipers and having nerves. There was nobody that could really beat them across, across all of Canada. We made a reputation for ourselves but it wasnʼt til about ten years later, after the war, that this all come out; how come they were like that. As soon as they seen that our men were like that, haam, they used them, they picked them right up and they used them for snipers. They were hardest place to go out, they went to The Chaps and everything. It all come back to that adolescent training. And I know this one part where this boy, the men... We donʼt have any men now that remember all of that. It is all gone; the men are gone. But I can remember different stories were told about this young boy. He was, he was a(n) orphan.

  - lineNumber: 48
    startTime: 374716
    endTime: 376005
    utterance: Aag̱áa áwé dei,
    translation: And then,

  - lineNumber: 49
    startTime: 376205
    endTime: 379081
    utterance: {du} du séni, no du káak
    translation: his paternal uncle, no his maternal uncle

  - lineNumber: 50
    startTime: 379281
    endTime: 387171
    utterance: took him in, and he was raising that little boy.

  - lineNumber: 51
    startTime: 387371
    endTime: 402861
    utterance: Á áwé, one of that training is when thereʼs ice on the water and itʼs cold, snow on the ground, the uncle would take them and take them down to the river or the lake,
    translation: So then, 

  - lineNumber: 52
    startTime: 403061
    endTime: 407380
    utterance: aag̱áa áwé theyʼd wade out,
    translation: and then theyʼd wade out,

  - lineNumber: 53
    startTime: 407580
    endTime: 443908
    utterance: wade out into the river. They walk out right up there with their hands folded like that. And if theyʼre walking too fast, he hollers at them to slow down. And they walk right out til theyʼre up right here to their neck. And then they turn around. And we believe, inland Tlingit, we believe in the sun, in the universe, the roundness. We always turn when we pray, we turn with the sun. [this is the same for Yakutat people]

  - lineNumber: 54
    startTime: 444108
    endTime: 445412
    utterance: Yéi áwé yatee, tle hú-
    translation: That is how it is, then he-

  - lineNumber: 55
    startTime: 445612
    endTime: 453679
    utterance: that boy comes back out. And if {it} the icing is too cold and his jaws are going, his uncle will holler at him,

  - lineNumber: 56
