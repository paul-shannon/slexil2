    utterance: (not) gonna go in Tlingit. I know you donʼt understand me, so Iʼll say, um, thanks, Alice, itʼs a good idea that you have had to do this, um, working on your project and recording it all. That way you have our voices. You have our, um, images.  And, um, I also said that, a, some years ago I worked for our Native owned and operated radio and television company. They did a project much the same. Um, I would do the interviewing and I would speak to, or I would interview a speaker. And they would record the whole thing. And ah, then theyʼd take it back to Whitehorse and somebody would record the, the uh, show on a cassette tape. And the cassette tape was sent to me.  Iʼd listen to it and transcribe it all and then Iʼd print it off and send the printed project back to, made out to the television company.  And then theyʼd work on it on the machine called, uh, Chiron.  And um, that puts the, the um, whole interview on, on tape. What would happen there is if they would, if I did the interview, then um, it was another speaker that  worked with me. Weʼd go in to Whitehorse and weʼd watch the show. And weʼd see the, the um, translations going across the bottom of the film. And say theyʼd stop at «yéi kuna» at this time. Thatʼs where the image would change. And as soon as they said «yéi kuna», weʼd say, "Now."  And they cut it off. So then, um then, the um, subtitling would stop at Now. And then the, the rest of the program would go on, and um. So then, the Tlingit is still audible but for those that donʼt understand, the subtitling is in there. Took quite a while but I think, [Recording ends here.]

