    translation: So, sewing,

  - lineNumber: 63
    startTime: 582243
    endTime: 663337
    utterance: cooking, and it all boils down to your future life what youʼre doing in that period of time. Itʼs so important. Because the way you act in that six weeks, thatʼs the way the rest of your life youʼre going to be. If you want to run uptown, you want to watch tv, you want to do, youʼre going to do it for the rest of your life. We know a lots of women that, that weʼve proven it, that they never sit down. And to this day theyʼre old and theyʼre still running downtown. They got to be in the streets. Theyʼre not home with their children. Our old people, thatʼs the way they used to say. Thatʼs why the Tlingit people had it above everybody else because they, they really believed in that kind of stuff. We sat there, I tell you, with them wrinkles on your face, before we know when a woman is going to {p} a young girl is going to turn into a woman, people go out and they look on her

