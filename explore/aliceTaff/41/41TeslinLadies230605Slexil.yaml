    endTime: 493557
    utterance: Wonʼt let him, his jaws hit. Take your time and come out. After they come out on the shore and aag̱áa áwé he hits them. They turn around again with the sun, aag̱áa áwé {they} he hits them, all up and down to get {the sore} the blood circulating, again. But he uses balsam brush, itʼs not sharp, itʼs soft balsam. And it gets some of the medicine off onto them. Um, never make a noise and 

