lines:
  - lineNumber: 1
    startTime: 0
    endTime: 1930
    utterance: (Yoo x̱at) duwasáakw Lingít x̱ʼeinax̱.
    translation: (I) am called in Lingít.

  - lineNumber: 2
    startTime: 2130
    endTime: 5490
    utterance: Iʼm called, uh, G̱unaakʼw in Tlingit.

  - lineNumber: 3
    startTime: 5690
    endTime: 7310
    utterance: My name is Fred White.

  - lineNumber: 4
    startTime: 7510
    endTime: 13240
    utterance: Aa yáatʼát áyáa ax̱ tuwáa sigóo a daat yóo x̱ʼax̱wataanée yáa x̱wsiteeni át.
    translation: So, I would like to talk about what I have seen.

  - lineNumber: 5
    startTime: 13440
    endTime: 20800
    utterance: Yáa déex̱ táakw shoowaxeex de, yáa Yaakwdáatxʼ ḵúnáx̱ ḵuyawutʼaayée.
    translation: Two years have passed now, since the weather here in Yakutat got very hot.

  - lineNumber: 6
    startTime: 21000
    endTime: 27920
    utterance: Yóo Sʼitáḵxʼ ḵa Aan Tleinxʼ áyá ax̱asg̱eiwú nuch. Am.
    translation: I setnet fish in the Situk and Ahrnklin rivers. Um.

  - lineNumber: 7
    startTime: 28120
    endTime: 36490
    utterance: At Gadax̱íttʼ Dísi kát áwé kootlʼéetʼaa haax̱ kalyeech.
    translation: In May [breeding month], the arctic terns usually fly up here.

  - lineNumber: 8
    startTime: 36690
    endTime: 43050
    utterance: Yóo naaliyéidáx̱ yáa, lingitʼaaní tayeedáx̱ haax̱ kalyeech.
    translation: From very far away, they fly here from the underside of the Earth.

  - lineNumber: 9
    startTime: 43250
    endTime: 46910
    utterance: Dleit ḵáa x'éináx̱ Antarctica yóo duwasáakw.
    translation: In English it's called Antarctica.

  - lineNumber: 10
    startTime: 47110
    endTime: 51930
    utterance: Áwé has x̱wusiteen, ah,
    translation: Well I saw them, uh,

  - lineNumber: 11
    startTime: 52130
    endTime: 53790
    utterance: ḵutaan kaanáx̱.
    translation: throughout the summer.

  - lineNumber: 12
    startTime: 53990
    endTime: 56181
    utterance: Ḵuyaawatʼáa.
    translation: The weather was hot.

  - lineNumber: 13
    startTime: 56381
    endTime: 60249
    utterance: Á áwé kootl'éetʼaa kʼwátʼig̱áa wtuwa.aat Sʼitáḵde.
    translation: So we went out to Situk to gather tern eggs.

  - lineNumber: 14
    startTime: 60449
    endTime: 62874
    utterance: Aan Tleinx' tlákw áx̱ too.aat
    translation: We always walk around over at Ahrnklin

  - lineNumber: 15
    startTime: 63074
    endTime: 65919
    utterance: katoodatxʼu nuch.
    translation: ???

  - lineNumber: 16
    startTime: 66119
    endTime: 71230
    utterance: Áwé wáa sáyóo wé kootlʼéetʼaa s awsikóo ḵuyakg̱watʼaayée?
    translation: Now how did the terns know that the weather was going to be hot?

  - lineNumber: 17
    startTime: 71430
    endTime: 75214
    utterance: Tle yóo naakéexʼ áwé has awdlikʼwátʼ wé chookán x̱ooxʼ.
    translation: They nested further up the river where all the beach grass was growing.

  - lineNumber: 18
    startTime: 75414
    endTime: 79140
    utterance: Tsʼootaatxʼ áwé yaklahéen nuch.
    translation: In the morning, the surface (of the grass) would  have dew on it.

  - lineNumber: 19
    startTime: 79340
    endTime: 86080
    utterance: Á áwé átx̱ has awliyéx̱ wéi chookán daatx̱ wé héen.
    translation: So they used the water that was on the beach grass.

  - lineNumber: 20
    startTime: 86280
    endTime: 90740
    utterance: Wé hasdu kʼwátʼi hél kakg̱washtóok.
    translation: Their eggs wouldnʼt crack.

  - lineNumber: 21
    startTime: 90940
    endTime: 95920
    utterance: Am, ax̱ léelkʼwch áwé ax̱ een kaawaneek
    translation: Um, my grandfather told me

  - lineNumber: 22
    startTime: 96120
    endTime: 99616
    utterance: wéi ḵutaanx'
    translation: that in the summer

  - lineNumber: 23
    startTime: 99816
    endTime: 102354
    utterance: ch'a yákʼwdáx̱ séew daak wustaaní,
    translation: when we have a sudden downpour of rain,

  - lineNumber: 24
    startTime: 102554
    endTime: 106685
    utterance: kéidladee k'wátʼi kakg̱washtóok yís.
    translation: itʼs so the seagull eggs can crack.

  - lineNumber: 25
    startTime: 106885
    endTime: 110380
    utterance: Kang̱ashtóogu yís áwé daak ustaanch.
    translation: It rains so that they can crack.

  - lineNumber: 26
    startTime: 110580
    endTime: 114970
    utterance: Ách áwé yawx̱aatín wé aadé yaa naneen yé.
    translation: Thatʼs why I recognized what was happening.

  - lineNumber: 27
    startTime: 115170
    endTime: 118025
    utterance: Wáa sá s awsikóo wé kootl'éet'aa
    translation: How did those terns know

  - lineNumber: 28
    startTime: 118225
    endTime: 121354
    utterance: ḵuyakg̱watʼaayée wé ḵutaan ḵaanáx̱?
    translation: that we were going to have a hot summer?

  - lineNumber: 29
    startTime: 121554
    endTime: 128090
    utterance: Á áwé hasdu ah, kúdee naakéexʼ yéi s awsinee wé chookán x̱ooxʼ.   
    translation: So they uh, made their nests farther up among the beach grass.

  - lineNumber: 30
    startTime: 128290
    endTime: 136220
    utterance: Ḵa {wéi} yá Dís Yádi yawux̱eeyée áwé,
    translation: And as the month of September [child moon] goes by,

  - lineNumber: 31
    startTime: 136420
    endTime: 142020
    utterance: cháasʼ atoosg̱eiwú yú naakéexʼ. [naatéexʼ?]
    translation: we fish humpies upriver.

  - lineNumber: 32
    startTime: 142220
    endTime: 147720
    utterance: Á áwé wtusiteen wé atgutóodáx̱ daak uwagut xóots, du yádi teen.
    translation: Thatʼs when we saw this bear that came down out of the woods with her cubs.

  - lineNumber: 33
    startTime: 147920
    endTime: 154940
    utterance: De Dís Yádi áwé, September yát áwé, 
    translation: It was September at that time, it was during September,

  - lineNumber: 34
    startTime: 155140
    endTime: 159390
    utterance: ch'oo yéi has kudzigéink' wé {a yá} wé xóots yádi.
    translation: those bear cubs were still pretty small.

  - lineNumber: 35
    startTime: 159590
    endTime: 163026
    utterance: At Gadax̱íttʼ Dísi kát ḵug̱asteech át áwé.
    translation: They're usually born in the month of May.

  - lineNumber: 36
    startTime: 163226
    endTime: 172317
    utterance: De {chʼa yeis de násʼk táakw} nás'k dís áwé shoowaxeex      
    translation: Three months had all ready gone by

  - lineNumber: 37
    startTime: 172517
    endTime: 175041
    utterance: ag̱aa has ḵugasteech yé.
    translation: since they should have been born.

  - lineNumber: 38
    startTime: 175241
    endTime: 179479
    utterance: á áwé ch'oo yéi has kudzigéi.
    translation: but they were still small. [They should have been bigger.]

  - lineNumber: 39
    startTime: 179679
    endTime: 184270
    utterance: Á áwé tsóo haa yáa ḵut woonee, chʼa yeisóos ḵuwdzitiyi át áwé de
    translation: That really shocked us too, that they were tiny cubs yet.  [That they were things that had just been born.]

  - lineNumber: 40
    startTime: 184470
    endTime: 187490
    utterance: Dís Yádi, dleit ḵáa x̱ʼéináx̱ September yéi duwasáakw.
    translation: in September, what they call September in English.

  - lineNumber: 41
    startTime: 187690
    endTime: 191080
    utterance: Aag̱áa áwé daak uwa.át wé xóots du yádi teen.
    translation: Thatʼs when that bear walked down with her cubs.

  - lineNumber: 42
    startTime: 191280
    endTime: 193500
    utterance: Ḵa wéi a,
    translation: And the um,

  - lineNumber: 43
    startTime: 193700
    endTime: 196745
    utterance: shákwg̱aa áyá tsóo wtuwaḵoox̱ yáa ḵutaan.
    translation: we went out on the boat for strawberries in the summer.

  - lineNumber: 44
    startTime: 196945
    endTime: 204342
    utterance: De am, Shaaxʼw Xeiyí Dísi kát áwé, August,
    translation: It was um, Mountain Shadow Moon [when the mountains cast shadows on Tlingit Country], August,

  - lineNumber: 45
    startTime: 204542
    endTime: 207180
    utterance: wutusiteen g̱uwakaan.
    translation: we saw deer.

  - lineNumber: 46
    startTime: 207380
    endTime: 210883
    utterance: Wé ax̱ keidlí áwé a kát wujikʼén wé a yádi.
    translation: My dog jumped on its fawn.

  - lineNumber: 47
    startTime: 211083
    endTime: 216450
    utterance: Á áwé át wujixíx. Wé a yádi ḵwaawé chʼa yeisú ḵuwdzitiyéyáx̱ áwé duwatéen.
    translation: Then it took off running. Itʼs fawn though, it looked like it had just been born.

  - lineNumber: 48
    startTime: 216650
    endTime: 221680
    utterance: Wéi dleit yáx̱ kayateeyi át áwé du daakáa wootee, chʼa yeisú ḵuwdzitee.
    translation: Those little round white things were covering itʼs body, it had just been born.

  - lineNumber: 49
    startTime: 221880
    endTime: 224550
    utterance: Ch'a August ḵu.aa áyá.
    translation: But it was in August.

  - lineNumber: 50
    startTime: 224750
    endTime: 229804
    utterance: Hás tsú June yát áwé has kustee nuch.
    translation: They are also usually born in June.

  - lineNumber: 51
    startTime: 229807
    endTime: 237350
    utterance: Yéi áwé at wutusiteen yá, yá taakw, yáa haa ḵutí teen aadé yaa naneen yé.
    translation: This is what we have seen this year (2008) with what is happening with our weather here.

  - lineNumber: 52
    startTime: 237550
    endTime: 241300
    utterance: Yáa haa aanée kát woo.aadée atgutu.ádi.
    translation: The animals that live on our land.

  - lineNumber: 53
    startTime: 241500
    endTime: 243505
    utterance: Yéi áwé sh kakḵwalneek. Gunalchéesh.
    translation: That is all of the story I am going to tell. Thank you.

  - lineNumber: 54
    startTime: 243705
    endTime: 246353
    utterance: Speaker is G̱unaakʼw Fred White. Recorded Oct 8, 2008, in Yakutat, Alaska, by Ḵaa Saayí Tláa Amanda Porter.

  - lineNumber: 55
    startTime: 246553
    endTime: 249969
