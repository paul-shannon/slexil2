    endTime: 2424497
    utterance: Theyʼre in J, I think sheʼs in Juneau now.  What I talked about in the beginning was um, I grew up on a boat and uh, my grandma was really old but she did a lot of things. They were in charge of, ah, all the, what people call today, subsistence. That was our life style as a family, on the 2, 2, 3 boats, 4 boats all together. And um, we went from camp to camp. I didnʼt go to school. But um, I dropped out at 6th grade. I couldnʼt hack it. I was a teenager. I couldnʼt stand it. And uh, I had a hard time with English-only teachers. They hit my hand when I was speaking Tlingit. I couldnʼt speak English at all. So, they punished me because that was the only language I knew was Tlingit. Anyway, um, after I dropped out, I got married and then I, I went to, um, jobs, menial jobs from, I didnʼt tell about this in Tlingit, menial jobs,  but they were um, working in laundries, working in hotels. Working in restaurants and stuff like that. And then I finally got hired by the school to teach Tlingit. And, a, I think my own friend um, fouled me up. I didnʼt tell anybody that I was a 6th grade drop out. She was the only one that knew. And uh, they held it against me that I was a 6th grade drop out. [Laughter]   Oh, itʼs OK but she...  They still have, blah blah, blah.  So, I left the school. The kids that I taught at that time are doing something with their lives, in Tlingit. They were um, not Tlingit when I got them. But theyʼre doing something with their lives in Tlingit. So thatʼs, that was good. The short time we had was good. And then um, my dad um, took us from camp to camp. I was talking about that. We went to cannery. And then we went to um, we went to trapping camps. And um, dry fish camp. We did the three months. We dried about 400 to 300 salmon. That was enough for all of us for the whole winter. And my grandma never quit saying 300. You canʼt go, you canʼt get less than 300. So theyʼd go after some more. [Laughter] Sheʼs just this little old lady; she really ruled the family! And um, that was my life style. And it was to-taly Tlingit.

