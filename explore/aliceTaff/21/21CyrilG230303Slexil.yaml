  - lineNumber: 1
    startTime: 0
    endTime: 1349
    utterance: Ḵuwduwatlágu yé.
    translation: The place that has been told of.

  - lineNumber: 4
    startTime: 6045
    endTime: 10559
    utterance: To the people that, that were listening to him, what he meant was,

  - lineNumber: 5
    startTime: 10759
    endTime: 15901
    utterance: "At last, Iʼve seen heaven,

  - lineNumber: 6
    startTime: 15903
    endTime: 19512
    utterance: where my roots originate.

  - lineNumber: 7
    startTime: 19712
    endTime: 23092
    utterance: Haa shagóon.
    translation: Our ancestral history.

  - lineNumber: 8
    startTime: 23292
    endTime: 35864
    utterance: I told them, "That's the way I feel as I stand here today in front of you people."  Boy, I knew I had them.

  - lineNumber: 9
    startTime: 36064
    endTime: 39420
    utterance: [At.shooḵ.] 
    translation: [Laughter.]

  - lineNumber: 10
    startTime: 68474
    endTime: 137360
    utterance: To my way of thinking that was about the prettiest little speech I ever heard, by, my little buddy here, just a little bit older than me. He was from Hoonah. Richard Sheakley, heʼs gone now. I got to know him when we were little guys. I got on a boat when I was eight years old so I spent a lot of time in Hoonah summertime.  Got to know all these, I got invited to the parties in Hoonah. When I, when I got over there for, for the parties all the Ravens, "Hey, go on, go on, sit by us," you know. This one time they, we got invited. Weʼre sitting there. Richard got up. What he said is,

  - lineNumber: 11
    startTime: 137560
    endTime: 140500
    utterance: Yeisú tatgé áyá
    translation: It was just yesterday

  - lineNumber: 12
    startTime: 140700
    endTime: 144470
    utterance: x̱'at'aaḵdáx̱ at x̱alatín.
    translation: I was watching from the front of the house by the door.

  - lineNumber: 13
    startTime: 144670
    endTime: 146882
    utterance: Yadak'átsk'ux̱ x̱at sitée.  
    translation: I was a   little boy.

  - lineNumber: 14
    startTime: 147082
    endTime: 154403
    utterance: I was a boy.

  - lineNumber: 15
    startTime: 154406
    endTime: 159771
    utterance: Haa káak hás
    translation: Our maternal uncles

  - lineNumber: 16
    startTime: 159971
    endTime: 165185
    utterance: yee {daaxʼ} daag̱áa yoo has x̱'ali.átk.
    translation: were talking for you folksʼ benefit.

  - lineNumber: 17
    startTime: 165385
    endTime: 167342
    utterance: Wooch yáa awoodané.
    translation: Mutual respect.

  - lineNumber: 18
    startTime: 167542
    endTime: 169557
    utterance: Wooch isx̱án.
    translation: Mutual love.

  - lineNumber: 19
    startTime: 169757
    endTime: 174414
    utterance: Haa kaaniyán.
    translation: Our brothers-in-law.

  - lineNumber: 20
    startTime: 174614
    endTime: 176871
    utterance: Yeedát áwé x̱át,
    translation: Right now, me,

  - lineNumber: 21
    startTime: 177071
    endTime: 180542
    utterance: yan kawátx̱ x̱at sitee.
    translation: I am an elderly person.

  - lineNumber: 22
    startTime: 180742
    endTime: 185382
    utterance: Át x̱at x̱'ayawji.áak.
    translation: I am fumbling my words.

  - lineNumber: 23
    startTime: 185582
    endTime: 189560
    utterance: You know what that means, át yawji.áak?
    translation: You know what that means, heʼs staggering around?

  - lineNumber: 24
    startTime: 189760
    endTime: 227555
    utterance: When a fish gets wounded. Thatʼs what he likened his speech to. Now that youʼre standing in front of our brother-in-laws. Richard, heʼs gone. They, um, I ah, I worked on the words to the Lordʼs Prayer. You want to start with that?   

  - lineNumber: 25
    startTime: 227755
    endTime: 228440
    utterance: Whatʼs that?

  - lineNumber: 26
    startTime: 228640
    endTime: 229425
    utterance: Sure.

  - lineNumber: 27
    startTime: 229625
    endTime: 230440
    utterance: OK.

  - lineNumber: 28
    startTime: 230640
    endTime: 232348
    utterance: Lisʼé.
    translation: Wait a minute.

  - lineNumber: 29
    startTime: 232548
    endTime: 283449
    utterance: Iʼve got it. Iʼve got it. I uh, I had a model to go by. The Russian church has one but some of the words they put in there were put in there to go with the musics. Some of those I eliminated and just made a straight prayer. I gave it, I gave it to Walter Soboleff to... I told him, "You can mark it up." He came over and gave it back to me, "This is good." He liked it.  OK.

  - lineNumber: 30
    startTime: 283649
    endTime: 287335
    utterance: Haa Éesh, Dikée Aanḵáawu,
    translation: Our Father, the Lord Above,

  - lineNumber: 31
    startTime: 287535
    endTime: 292460
    utterance: gax̱lasaayí i saayí.
    translation: may your name be glorified.

  - lineNumber: 32
    startTime: 292660
    endTime: 297140
    utterance: Haat g̱agoot haa tl'átgi kaadé.
    translation: Let him come onto our land.

  - lineNumber: 33
    startTime: 297340
    endTime: 310130
    utterance: Ḵúnáx̱ i aayí a yáx̱ ḵug̱aax̱toostee yá diyéex' chʼa wé dikée yáx̱.
    translation: May we live as your own here below, just as above.

  - lineNumber: 34
    startTime: 310330
    endTime: 314274
    utterance: Haa jeet tí yáa yakyee
    translation: Give us this day

  - lineNumber: 35
    startTime: 314474
    endTime: 319047
    utterance: ḵustí sakwnéin.
    translation: the bread of life.

  - lineNumber: 36
    startTime: 319247
    endTime: 322997
    utterance: Ch'a aadéi yéi na.oo haa l.ushk'eiyí
    translation: Forgive our evil

  - lineNumber: 37
    startTime: 323197
    endTime: 331430
    utterance: wáa sá uháanch ch'a aadé yéi too.úx̱x' g̱unaḵáa l.ushkʼeiyí.
    translation: as we ourselves forgive the evil of other people.

  - lineNumber: 38
    startTime: 331630
    endTime: 334512
    utterance: Haa dakán shunagú
    translation: Lead it away from us

  - lineNumber: 39
    startTime: 334712
    endTime: 339246
    utterance: daa sá haa koo.aag̱ú
    translation: whatever tempts us

  - lineNumber: 40
    startTime: 339446
    endTime: 341433
    utterance: ḵa haa x̱saneix̱
    translation: and save us

  - lineNumber: 41
    startTime: 341633
    endTime: 346528
    utterance: Diyée Aanḵáawu jeedáx̱.
    translation: from the Lord Below.

  - lineNumber: 42
    startTime: 346728
    endTime: 351211
    utterance: {i} L.ulitoogu i saayí tóonáx̱ yéi ng̱atee.
    translation: Let be done in Your Pure Name.

  - lineNumber: 43
    startTime: 351411
    endTime: 423337
    utterance: Amen. I, uh, I tell some people now, uh, I went to Seattle for their celebration over a year ago.  They asked me to pray. It was a Tlingit and Haida and Tsimshian celebration. When I got up I told them, "To be in keeping with, with this get together," I told them, "Iʼm going to pray in Tlingit." There are some words that really touch me when I, because of the way the words came about. Like when weʼre, like when weʼre asking for something.

  - lineNumber: 44
    startTime: 423537
    endTime: 427260
    utterance: You say, «toosg̱áax̱.»
    translation: You say, "We beg."

  - lineNumber: 45
    startTime: 427460
    endTime: 430150
    utterance: Gáax̱.
    translation: Crying.

  - lineNumber: 46
    startTime: 430350
    endTime: 471129
    utterance: This is my thoughts, Iʼve never heard anybody else. Itʼs crying. A baby when it wants anything, wants it so bad you know, it cry for it. So when weʼre praying we say toosg̱áax̱. Weʼre asking. The, uh, Tlingits, sometime... Just sitting here sometime I think about some of the... Did you know Tlingits can only count to five? 

  - lineNumber: 47
    startTime: 471329
    endTime: 474950
    utterance: Really?

  - lineNumber: 48
    startTime: 475150
    endTime: 480976
    utterance: From there we can go to thousands. You ever hear that?

  - lineNumber: 49
    startTime: 481176
    endTime: 483163
    utterance: Unh-uh.

  - lineNumber: 50
    startTime: 483169
    endTime: 484019
    utterance: How come?

  - lineNumber: 51
    startTime: 484219
    endTime: 486827
    utterance: I donʼt know.

  - lineNumber: 52
    startTime: 487027
    endTime: 490759
    utterance: Tlél haa een kawduneek shákdé.
    translation: They didn't tell us, maybe.

  - lineNumber: 53
    startTime: 490959
    endTime: 495375
    utterance: Thereʼs only, we only count to five.

  - lineNumber: 54
    startTime: 495575
    endTime: 497627
    utterance: Tléix',
    translation: 1

  - lineNumber: 55
    startTime: 497827
    endTime: 499490
    utterance: déix̱,
    translation: 2

  - lineNumber: 56
    startTime: 499690
    endTime: 501411
    utterance: nás'k,
    translation: 3

  - lineNumber: 57
    startTime: 501611
    endTime: 503370
    utterance: daax'oon,
    translation: 4

  - lineNumber: 58
    startTime: 503570
    endTime: 505504
    utterance: keejín,
    translation: 5

  - lineNumber: 59
    startTime: 505704
    endTime: 507182
    utterance: one hand.

  - lineNumber: 60
    startTime: 507382
    endTime: 510529
    utterance: When you start with six,

  - lineNumber: 61
    startTime: 510729
    endTime: 511870
    utterance: tleidooshú,
    translation: 6

  - lineNumber: 62
    startTime: 512070
    endTime: 514225
    utterance: tléixʼt uwashóo,
    translation: It has extended to one.

  - lineNumber: 63
    startTime: 514425
    endTime: 517049
    utterance: seven, déix̱t uwashóo,
    translation: 7, it has extended to two.

  - lineNumber: 64
    startTime: 517249
    endTime: 522089
    utterance: Itʼs running to two. And it keeps going,

  - lineNumber: 65
    startTime: 522289
    endTime: 525576
    utterance: nás'gadooshú.
    translation: 8.

  - lineNumber: 66
    startTime: 525776
    endTime: 536620
    utterance: When youʼre about to accomplish whatever youʼre doing, you kinda smile to yourself, when you get to four, to nine you say,

  - lineNumber: 67
    startTime: 536820
    endTime: 537841
    utterance: gooshúḵ.
    translation: 9.

  - lineNumber: 68
    startTime: 538041
    endTime: 547554
    utterance: Your thumb is smiling. At nine, see? And when you hit ten, you say,

  - lineNumber: 69
    startTime: 547754
    endTime: 551097
    utterance: jinkaat
    translation: 10.

  - lineNumber: 70
    startTime: 551297
    endTime: 552841
    utterance: Thatʼs jinkaat.
    translation: 10

  - lineNumber: 71
    startTime: 553041
    endTime: 556410
    utterance: Then you go from there,

  - lineNumber: 72
    startTime: 556610
    endTime: 560000
    utterance: jinkaat ḵa tléix', jinkaat ḵa déix̱.
    translation: 11, 12

  - lineNumber: 73
    startTime: 560200
    endTime: 562128
    utterance: And when you get to 20 you say,

  - lineNumber: 74
    startTime: 562328
    endTime: 563287
    utterance: tleiḵáa,
    translation: 20, one man

  - lineNumber: 75
    startTime: 563487
    endTime: 580722
    utterance: One man. I donʼt know why Iʼm telling you my secrets.     Hands and feet.

  - lineNumber: 76
    startTime: 580922
    endTime: 585002
    utterance: Gunalchéesh.

  - lineNumber: 77
    startTime: 585202
    endTime: 590050
    utterance: Do you have stuff you want to ask him, or

  - lineNumber: 78
    startTime: 590250
    endTime: 591733
    utterance: Wáa sá iduwasáakw?
    translation: What are you called?

  - lineNumber: 79
    startTime: 591933
    endTime: 598246
    utterance: Have him tell us his names. Tell him what are his names?

  - lineNumber: 80
    startTime: 598446
    endTime: 602946
    utterance: Aadóo sáwé wa.é?
    translation: Who are you?

  - lineNumber: 81
    startTime: 603146
    endTime: 723630
    utterance: When I was born I was given the name Ḵaalkáawu. I was born in Hood Bay. There was a little saltery. The main cannery is right here, and where the, uh, killer whale tribe originated on this side the bay back in here. They owned that,  Daḵlʼaweidí. I was born in that saltery. The, uh, my dad was fishing herrings. Saltery, it was called that cause they did fancy pack in trays. They, they gutted the herring, took it, cleaned it, then it was salted. Called the saltery. Thatʼs where I was born. I was born 1922.  I, my name comes from William Peters. You ever hear that name? Old man William Peters. His name was Ḵalḵáawu. I was never told why, but my mom told me when I was born he had a seine boat and was living in Sitka. He came all the way from Sitka to saltery. He came to my mom. He said,

  - lineNumber: 82
    startTime: 723830
    endTime: 726614
    utterance: «Ḵáak'w ák.wé?»
    translation: "Is it a little boy?"

  - lineNumber: 83
    startTime: 726814
    endTime: 730170
    utterance: She said, «Aaá.»
    translation: She said, "Yes."

  - lineNumber: 84
    startTime: 730370
    endTime: 736392
    utterance: «Ax̱ tuwáx' sigóo ax̱ saayí du yáx' yéi wuteeyí.
    translation: "I want my name to be on his face.

  - lineNumber: 85
    startTime: 736592
    endTime: 742370
    utterance: Ch'a aan ḵaa waḵshiyéex' kei nax̱dahánch.»
    translation: Let him always stand in front of the people with it."

  - lineNumber: 86
    startTime: 742570
    endTime: 750907
    utterance: Even back in 1922 they already knew our way of life was drifting away from us.

  - lineNumber: 87
    startTime: 751107
    endTime: 756540
    utterance: «Haa jináḵ yaa nalhásh,» they used to say.
    translation: "It's drifting away from us," they used to say.

  - lineNumber: 88
    startTime: 756740
    endTime: 760300
    utterance: «Chʼa aan ḵaa waḵshiyeexʼ kei nax̱dahánch.»
    translation: "Let him always stand in front of the people with it."
    Notes-cp: ShÉDA: Check form and gloss of kei nax̱dahánch, which could be on of two homophonous possibilities: repetitive-3(s)hortative with n- or repetitive-1(s) with n-. In either case, the n- prefix is unusual and appears to have the same form and gloss to that found in AHʼs Yéil Ḵa Ḵei.á (subj.-ch nax̱danáat).

  - lineNumber: 89
    startTime: 760500
    endTime: 764783
    utterance: Ax̱ saayí.
    translation: My name.

  - lineNumber: 90
    startTime: 764983
    endTime: 771153
    utterance: It wasnʼt until just recently I found out the reason why he did that.

  - lineNumber: 91
    startTime: 771353
    endTime: 776077
    utterance: My mom's name was Heex'wé.

  - lineNumber: 92
    startTime: 776277
    endTime: 782377
    utterance: His mom's name was Heexʼwé.

  - lineNumber: 93
    startTime: 782577
    endTime: 1152284
    utterance: So he gave me that name. Some of the things that happened. Then we lived at Kilisnoo. I lived in Kilisnoo until 1928. Thatʼs when Kilisnoo burned, the fire. At that time in 1928 it was the largest herring plant in the world. We were rendering oil and we were making fertilizer also. There was a lot of history in Kilisnoo. In 1882 it was a whaling station, Kilisnoo. Our, our shaman got killed. It was an accident. They, um, he was on a gun boat right in the bow where the harpoon is. That gun exploded. Killed our shaman. One thing the a, white people didnʼt understand that was, a good shaman he has the same standing as a chief. When they die we go through everything just like a chief. So the people, we donʼt work for a certain number of days, mourning. Some of the white people thought we were going to we were going to kill some white people to bring things even but that wasnʼt it. One of the things that kind of embarrasses me when itʼs being told is that the Angoon Indians demanded 400 blankets for the life of a Shaman. We uh, we give up something. This is, this comes from respect for... Iʼll tell you a little story that our chief in Basket Bay, he had a little seine boat. Heʼd go fishing with him. Thereʼs a boy fishing with him. He was from our side too but from a different house of course. One day the boy drowned off his boat when they were fishing. My uncle Peter Dick told me. Our chief gathered the family. See, we were just a family that lived in Basket Bay. And this William Peters, he didnʼt move out of there, well he moved out of there in 1902 because of schools. But one of his daughters, Flora Gamble was born there when they came back for drying fish. Some of the little houses were still, still up. So Flora was born there in 1904. We, um, some of those uh, thereʼs some, to my way of thinking thereʼs some missing links for actually tying together weʼre from Angoon. Sometimes some of them they, I get that some of the young guys there, you canʼt talk about anything thatʼs from the next door. Even if itʼs your grandfatherʼs house. Talk about your own house. The a, I was telling about this, when this chief got his family together, he told them,

  - lineNumber: 94
    startTime: 1152484
    endTime: 1155678
    utterance: «Ḵaa naawuweidí,
    translation: "Payment for a peopleʼs dead,

  - lineNumber: 95
    startTime: 1155878
    endTime: 1158800
    utterance: áyá téil a yeidí ax̱ jee.»
    translation: I donʼt have the payment for it."

  - lineNumber: 96
    startTime: 1159000
    endTime: 1426540
    utterance: He said he was embarrassed that, thatʼs what they called this gift that we give to another person. Thatʼs done out of respect for, for this chief. He got up, went in the bedroom and brought out our original beaver tunic. Uncle Pete told me this story when he ordered a replacement. When it was finished, my cousin Steven Bell and I paid for it. The um, Pete, he got, he got hurt. He was a tough guy. Rugged. Well they were out fishing one time. They were straightening out the leads. Hoist the leads way up, you know, and get them so that theyʼll come. That block broke. Pete was pushing them. He fell on that rail. They say it broke ribs but he didnʼt stay in the hospital that long and I guess he never took care of it. He, he was a tough guy. It turned to tuburculosis. Some of the things I like because thatʼs the way I was told and the people from Klukwan tell me that Jennie Tlunaut is our grandaughter. Her mom was married to our chief. Sheʼs the one that made the replacement, Jennie. She hand delivered it to Angoon. As luck would have it, 1942, she came down with it. Uncle Peter was already bedridden. Pete, he was a big money maker. He was a head carpenter. He traveled through the Interior and the Aleutians. But his money was gone by the time that it... He sent for us; we just got in from the fall fishing. He called us. He said, "Iʼm in an embarrassing way." He said, "I reported, I ordered this replacement. Now itʼs finished and she brought it here." She saw, she saw him, she started to cry and just knocked the price way down. We got it for $1200 in ʼ42. Ḵaanaawuweidí. This boy that was, that drowned off our chiefʼs boat, his family got that.

  - lineNumber: 97
    startTime: 1426740
    endTime: 1431840
    utterance: Ḵaanaawuweidí we call it.
    translation: We call it payment for somebodyʼs dead.

  - lineNumber: 98
    startTime: 1432040
    endTime: 1732111
    utterance: We expect this, but white people die. It always kind of embarrasses me when they, the way they put it when they see um. Let's see now. This is where I... The um, the teacher in Kilisnoo, he just took off for Sitka. There was the beginning of the Navy there. He went over there and told the Navy that the Indians of Angoon are getting ready to kill the white people. They came and just opened fire on Angoon. They um, I heard old man Billy Jones tell this. He stood in the  middle of the hall and they were talking about this bombardment. He said his mom was holding his hands. She was crying. He was asking her why they were doing that and she didnʼt know. Seven lives, kids, smoke inhalation. All our canoes, our winter supply of food. Navy burned everything and looted our artifacts. Letʼs see, we found them. In Denver thereʼs a beaver hat. Nobody knows they um, Harold Jacobs was telling me I should put in for it but I didnʼt. I figure if I put a claim on anything I should be able to stand up in front them. You donʼt know whoʼs behind us then. Thereʼs one, in Klukwan we have a, did you know we have a, well I think you do, well we have Ishka Hít? Thereʼs um, thereʼs a tunic at the museum in Seattle. I recognize that little beaver standing on the tunic in a glass case. So I went there and I started to read the plaque there. See Basket Bay chief  built Ishka Hít in Klukwan. When he died, his wife sold that. He was married to a Tsimshian girl. So they, um, when we were looking at that, Harold Jacobs asked me if Iʼd like to put in, put a claim on that. Boy. I thought about it for three days. Finally told him, no. If our chief built a house, there must be some people in Klukwan that come from that house. I wouldnʼt want to deprive them of that. So I didnʼt.

  - lineNumber: 99
    startTime: 1732311
    endTime: 1735699
    utterance: Ishkeetaan is the same thing, right?    Yeah.

  - lineNumber: 100
    startTime: 1735899
    endTime: 1746758
    utterance: And sure enough there are some people going, "Iʼm from Ishka Hít." Those are, 

  - lineNumber: 101
    startTime: 1746958
    endTime: 1758111
    utterance: Jackie Shopert and Ben Schleifman. They're Ishkeetaan.

  - lineNumber: 102
    startTime: 1758311
    endTime: 1778430
    utterance: Ohhh. Boy thereʼs, I have, I have some sayings that, if I hear a name like your, you,

  - lineNumber: 103
    startTime: 1778630
    endTime: 1782488
    utterance: Dzéiwsh.
    translation: [James Crippen's name]

  - lineNumber: 104
    startTime: 1782688
    endTime: 1796488
    utterance: It was a, James, I was telling the people at the Princeton Hall (boat name) the other night. Our people couldn't say James.

  - lineNumber: 105
    startTime: 1796688
    endTime: 1799760
    utterance: (Theyʼd) say Dzéiwsh.
    translation: Theyʼd say Dzéiwsh.

  - lineNumber: 106
    startTime: 1799960
    endTime: 1809776
    utterance: Through the years it got accepted as a Tlingit name. 

  - lineNumber: 107
    startTime: 1809976
    endTime: 1813400
    utterance: Dzéiwsh.
    translation: James.

  - lineNumber: 108
    startTime: 1813600
    endTime: 1952800
    utterance: Thatʼs um, James Geetwéinʼs name. The um, I tell the people that when I tell the stories, that we, weʼre taught. Weʼre taught everything has a spirit, the fish in the sea, animals in the woods. Respect. Donʼt hurt the feelings of these spirits. But of course, being humans, we even our teachers, they... And we have stories telling how they paid for their mistake. I tell the tourist, our people, when they talk about respect for spirits they say, above all, your grandparents, your parents, your brother-in-laws, your family, always respect. Or when I, when I tell a story, sometimes I jump around. Some of the um, times that we spent in certain places, some people ask me about the meaning of names. I told, tell them I donʼt know.

