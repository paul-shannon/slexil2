  - lineNumber: 113
    startTime: 1976677
    endTime: 2212911
    utterance: Just short of a mountain.  Robert Zuboff, he um, was quite a storyteller. He uh, he was taken up to University of Alaska Fairbanks for three and a half months. And thatʼs all he did. But I donʼt know what they did with it. Theyʼve got it there someplace. His stories. His stories are some that I never heard elsewhere. Yeah. Real interesting. I used to listen to him. I donʼt think some of his stories are written the way that he tells them sometimes. He uses rough language sometimes. [Laughter] One time he was in Angoon. He was a heavy. Thereʼs a guy that owned the store, Carl Jacobson, Jr.. He was built just like him. They were standing out in the front there Angoon looking down. Thereʼs a boulder there. Robert Zuboff told Carl Jacobson, "You see that rock over there? Thatʼs where we used to bust slavesʼ heads when they donʼt do what we tell them." Carl Jacobson, "How much is a life worth, Bob?" "Huh. Nice fat one like you and me, four blankets." [Laughter] He was always giving Carl Jacobson a rough time. One time he got a boil on his neck. He had two, two people take him down to the plane. He was just walking like...  When he came back, he came to the store. A lot of people were happy to see him. Carl Jacobson came out from his, back of the store. Says, "Well, Bob, what did the doctor say?" "Hah. The doctor, he say, 'You should wash your neck once in a while.'" [Laughter] Yeah, the, when Albert Dick died Peter Dick gave me his brotherʼs name.

