  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Dr. Shgóonde Walter Soboleff and Keihéenák’w John
    Martin. Recorded June 2, 2010 at the home of Walter Soboleff in
    Juneau, Alaska, by Ljáaḵkʼ Alice Taff.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Tlingit transcription by Daaljíni Mary Folletti. English
    translation by Ḵaanáḵ Ruth Demmert through 3:18, by Shakʼsháani
    Margaret Dutson through 26:38, and by Ḵaaḵal.aat Florence Sheakley
    through the end. Edited by Saḵaayí Anita Lafferty and X̱ʼaagi
    Sháawu Keri Eggleston.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    The first part of the grouse story is missing because Dr. Soboleff
