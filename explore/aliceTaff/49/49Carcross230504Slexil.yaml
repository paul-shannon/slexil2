  - lineNumber: 123
    startTime: 480537
    endTime: 555000
    utterance: This one here, it's a flower up in the mountain. I don't know what color it is or anything. My mum tell me about it. She said when she was 14, or 15, maybe 16, they were up in the mountains. And every springtime she said she get a boil there on her neck. And one time they were up in the mountains in the springtime and she had that boil. And my gramma dug that plant out. Never hit the roots or anything, the dirt, dig the dirt around the outside my mum say. And she rub it on her neck and talk Lingit to it, then she put it back in the ground and bury it up. My mom said inside of one week that boil was gone and it never returned again. And she said that plant in the mountains that flower she say its horrible, she say it hold the world together. So, I don't know how it looks or anything, I,  she donʼt, she didn't remember the color and stuff or how it looked, eh? 

  - lineNumber: 124
