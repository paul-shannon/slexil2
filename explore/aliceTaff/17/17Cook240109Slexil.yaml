    utterance: Daa sá yisi.ée nisdaat?
    translation: What did you cook last night?

  - lineNumber: 5
    startTime: 5166
    endTime: 7780
    utterance: Hél daa sá.
    translation: Nothing.

  - lineNumber: 6
    startTime: 7921
    endTime: 9140
    utterance: Eesháan!
    translation: Poor thing!

  - lineNumber: 7
    startTime: 9180
    endTime: 10458
    utterance: Tlél gé eex̱áa? [probably meant: tlél gé at yix̱á?] 
    translation: Didnʼt you eat?

  - lineNumber: 8
    startTime: 11120
    endTime: 13440
    utterance: A káx̱ x̱at x̱'akawdudligéiḵ ách áwé.
    translation: I was forbidden to eat, thatʼs why.

  - lineNumber: 9
    startTime: 13510
    endTime: 15431
    utterance: Aáa. Wé doctor-ch.
    translation: Yes. By the doctor.

  - lineNumber: 10
    startTime: 15750
    endTime: 16486
    utterance: Mmm.

  - lineNumber: 11
    startTime: 17400
    endTime: 19640
    utterance: Wa.é ḵu.aa?
    translation: What about you?

  - lineNumber: 12
    startTime: 20150
    endTime: 22790
    utterance: Daa sáwé yisi.ée nisdaat?
