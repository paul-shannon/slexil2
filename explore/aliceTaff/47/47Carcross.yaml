    grant 0853788 to the University of Alaska Southeast with Ljáaḵkʼ
    Alice Taff as Principal Investigator, and by National Endowment
    for the Humanities fellowship 266286-19 to Ljáaḵkʼ Alice Taff. Any
    opinions, findings, and conclusions or recommendations expressed
    in this material are those of the authors and do not necessarily
    reflect the views of the National Science Foundation or National
    Endowment for the Humanities.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Tlingit transcription by X̱ʼunei Lance Twitchell. English
    translation by Ḵaakal.aat Florence Sheakley, and by Shakʼsháani
    Margaret Dutson with Ljáaḵkʼ Alice Taff. Edited by Nakil.aan Mark
    Hans Chester, then by Yeiltʼoochʼ Tláa Collyne Bunn. We used ,
    using ELAN (Version 6.7, 6.8) [Computer software], (2023,
    2024). Nijmegen: Max Planck Institute for
    Psycholinguistics. Retrieved from https://archive.mpi.nl/tla/elan
    We use SLEXIL to render ELAN XML output as interactive web
    pages. Pronounced "sluck-HAIL", SLEXIL means daylight in the
    Lushootseed language, for which it was originally developed. The
    name may also be understod as an acronym: Software Linking ELAN
    XML to Illuminated Language.
    </div>"

