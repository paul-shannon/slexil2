  - lineNumber: 40
    startTime: 182377
    endTime: 257534
    utterance: The goal of this project is to preserve the way people talk everyday Tlingit. We’ll video-record you and your chosen friends in conversation. We’ll also record any other language material you suggest. We’ll make CDs of your recording. You will get a copy.  The recordings will be used for language learning by future generations and for study by linguists. You will be paid, working in conversation pairs so that recordings will document people conversing about common daily activities in a variety of settings such as fishing, camping, home repair, card playing, beach combing, anywhere the language is in use and people are willing. You speakers will say whatever you want to say.  It will take a little while before we all can carry on naturally while the camera is on.  We’ll record for as long as everyone feels comfortable. After each recording session, we will set up a time to listen to the Tlingit recordings so that speakers can give English translations. All speakers are invited to participate in the project.   

