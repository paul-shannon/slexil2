  - lineNumber: 30
    startTime: 326962
    endTime: 366954
    utterance: When that time comes, we let our hearts hang out. Weʼre as a people, we donʼt show emotion. But when our brother-in-law is hurting, we, we never hold back.  

  - lineNumber: 31
    startTime: 367154
    endTime: 368369
    utterance: Tlél wáa sá, góok.
    translation: It's OK, go ahead.

  - lineNumber: 32
