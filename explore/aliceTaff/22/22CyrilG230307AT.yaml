  - lineNumber: 155
    startTime: 1896430
    endTime: 2205060
    utterance: We, um, I tell the tourists, as I get older and think about these things, when I think back on some of the uh, things I was taught as I grew up, those things arenʼt so impossible. Weʼre taught to believe. Weʼre taught to believe. The Bible says the same thing. When we migrated from uh, from Teslin, that was after that world flood. The killer whale, killer whale tribe, they have stories. They originate in Hood Bay. As the tide started to move up, some of the people started to do the same thing. Animals started to do the same thing. Bears and wolves started to kill some of the people. Thereʼs a place across Angoon, Chatham Straits over here, the Chatham Cannery here up the... I used to love climbing the mountain with my dad, hunting. I came across one place there. You could see Point Gardiner out here, Admiralty Island. You can see Angoon over that way and all the way up this... I ask my dad if he knew anything about that. He hadnʼt heard. I came across this one in de Lagunaʼs stories when talking about Jimmy George and Billy Jones stories. There was a rock pile about that high. I donʼt know, not too long. Itʼs about... Up on that mountain. You donʼt see any loose rocks on it. Itʼs all in that. The men started to build those to protect their family. But later they finally started to build rafts. When we, when we left Teslin we got stuck around that mountain not too far from Teslin. Robert Zuboff, he told those old timers; I told you Robert told stories at the University of Alaska. With money he got paid he took his wife into Teslin and around there. He traded stories with a old timer. When he came down we went to see him. He told us, "By gosh," he said, "those people up there, they know our history better than we do."  Like the, being around that mountain, they told him, they were there for fourteen years. When we finally decided to move on, just about half of our people went back to Teslin. Thatʼs the old people.  They took some young ones. They didnʼt think theyʼd survive that. The, uh, killer whale tribe they... Iʼve heard some stories that were told and I donʼt remember and I donʼt dare tell them because theyʼre not my stories. But I tell this part when they joined us because they... That Lake Atlin, Atlin is a Tlingit name so

