  - lineNumber: 100
    startTime: 955111
    endTime: 1049191
    utterance: We still have that luck that, the story goes that this man, whatever heʼs going after, laid out where heʼs going, that wolf brought him luck. Nathan Jackson was the one that carved that totem pole. In the middle, that wolf, he had a piece of stick like a, a little bigger than that, stuck in it. During our speeches between me and Austin Hammond, we both pulled it out to thank the people for it. Yeah, thatʼs a good luck story. Would you like... Did I tell you that one on that, that boy? 

  - lineNumber: 101
    startTime: 1049391
