  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    CONTINUED from Tlingit Conversation 21. Speakers are Ḵaakáak’w
    Cyril George with Kathy Ruddy, Ḵaagwáaskʼ Ishmael Hope and Dzeiwsh
    James Crippen. Recorded July 8, 2010, by Naakil.aan Mark Hans
    Chester at Cyril George's home in Juneau, Alaska.
    </div>"

  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Tlingit transcription by Keet Yaanaayí Paul Marks II. English
    translation by Kaaxwaan Éesh George Davis with Ljáaḵkʼ Alice
    Taff. Edited by X̱ʼaagi Sháawu Keri Eggleston.  Also by Shag̱aaw
    Éesh Devlin Anderstrom.
    </div>"

