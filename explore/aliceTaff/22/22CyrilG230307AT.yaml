    utterance: How to, sometimes when I, when I address the opposite, specially the Kaagwaantaan,  sometimes it touches me here when I see some of those people. See, my wife, my first wife is Kaagwaantaan. My children are all Kaagwaantaan and my grandchildren are Kaagwaantaan. First time I did that was in Sitka. They were having a party. They held it at the Sheldon Jackson gym. I, um, I got up before them and... My Momʼs mother was Kaagwaantaan yádi. So, I started off very... Thereʼs some ladies there from Hoonah listening, 

