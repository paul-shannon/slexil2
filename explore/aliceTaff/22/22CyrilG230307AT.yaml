    utterance: "Duck towards your tail. You wonʼt feel a thing." Sure enough he saw his mom working on the fish there by the stream. He thought he was sitting there watching. After a while, she noticed. She yelled for somebody to bring a gaff hook. 'This fish keeps watching me.' When they brought that gaff hook just like he was told he, when he was gaffed he ducked towards his tail. They threw that fish in front of his mom. When she got through with the fish she went there to cut the head off. She screamed. She said her, she said this fish is wearing her boyʼs neckband. They have a neckband. The shaman didnʼt waste any time. At that house where they, told everybody, "Get busy clean out everything." Usually have mud floors. Everything was cleaned out. They put a board up above where that fire place is. This board they put feathers on it. Laid this fish on there. People came. Something was going to happen. Along about midnight they heard a hum coming from up there. MmMmmMmm. The young bucks climbed up there.

