    startTime: 3778
    endTime: 63950
    utterance: Like when thereʼs memorial or something, I, some of the people they uh, to me uh, [Laughter]  they um... Iʼd like to go up to Teslin again one more time. Boy those people they... I took my hat up there. Thereʼs a lot of Deisheetaan up there from Yukon. I got a good welcome up there. 

  - lineNumber: 4
