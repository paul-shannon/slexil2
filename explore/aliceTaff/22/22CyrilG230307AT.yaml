  - lineNumber: 128
    startTime: 1215105
    endTime: 1284755
    utterance: I heard this one used in, uh, during memorials when some people are hurting. You know, I told this story in Kake when Clarence Jacksonʼs mom died. They were having a memorial for her and ANB Hall. My wife and I went to the memorial. Saw Clarence Jackson sitting way up front there all by himself. We sat kind of in the back. I told Judy,"Iʼm going to go up there and tell him Iʼm, Iʼll  go with him to Kake."  "Go ahead," she said. So I went up, 

  - lineNumber: 129
    startTime: 1284955
    endTime: 1290660
    utterance: «Clarence, i een ḵukḵwatéen Ḵéex̱ʼde.»
    translation: "Clarence, I'll go with you to Kake."

  - lineNumber: 130
