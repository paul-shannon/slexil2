  - lineNumber: 162
    startTime: 2228365
    endTime: 2460719
    utterance: See they hit dry land up here above. When they saw us moving along over here some of the men came over. Asked, "What are you people doing?"  We told them we were going to salt water. They asked us, "Can we join you? Thatʼs where weʼre from." We were happy to have company. When some things happen. Did I tell you my mosquito story? Oh, at least one time but it would be good to hear again! Well Iʼll throw that one in. That mountain, when we lived around there for fourteen years, some of our men would go hunting. Disappear. Not a sign. Nothing. Some, some people were saying, "Thereʼs a cannibal around here." This one lady, she had two boys. The older one went hunting.  Never came back. The younger boy told his mom, "Iʼm going to go look for my brother. I think I know what happened to him. If people ask, just tell them I went hunting." So he was walking along. He saw this man off in, coming towards him. So he stood and watched him. As he got closer he could make out that man is carrying a club. When it was getting closer, he started to run towards him. The old timers up there told him, being seventeen years old, that boy, he froze from fright, couldnʼt move. When he came to, he was in a sack, laying on the ground. The sack was untied so he climbed out. He could hear this cannibal was inside a cave. Hear him moving around there.  Standing besides the opening, he saw that club there. He went over there and climbed over the opening. There he got ready; heʼs going to come out some time. He didnʼt wait very long; here he saw the head coming on. Boy swung. The cannibal went down so the boy jumps down. Really goes to work on him. When he is sure it was dead he sat down by it. He was thinking,

