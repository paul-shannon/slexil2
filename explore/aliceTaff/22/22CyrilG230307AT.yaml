  - lineNumber: 35
    startTime: 381266
    endTime: 575835
    utterance: (We need to add another tape to that. The battery? The microphone. His dadʼs clan. Whatʼs that? His dadʼs, his dadʼs clan. Oh did he finish? He didnʼt finish talking about his speech though, did he? No. OK. Iʼm listening. Pretty awsome. Yeah, when we get  chance weʼll ask him.  Gunalchéesh. Weʼll be fine.) [Ḵaakáak’w cannot hear so Ḵaagwáaskʼ is writing notes to him on a computer screen.] Say, um, I was invited to a, Fairbanks totem pole raising, Kaagwaantaan. The AFN (Alaska Federation of Natives)was having their convention up there. George Dalton from Hoonah. So I went up there. They asked me to help whatʼs his name, Austin Hammond.  He was always good with me. I, uh, I coordinated youth program for the CITA (???) programs when I was working at Central Council.  Austin, he came down one time to ask me for help. He had a youth camp up there. He was nice; he told me, He invited me to come up. So I went up and I stayed with him.  Oh, he liked it that I really understood his, my hearing was good then too, yeah. Just talking Tlingit. When I first got up there, next morning we got up.  
    translation: [ Crew is working with equipment.]

  - lineNumber: 36
    startTime: 576035
