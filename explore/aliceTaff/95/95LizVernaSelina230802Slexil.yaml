  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Shx̱oosʼáxsʼ Verna Johnson, (Raven, Deisheetaan, Ḵák'w
    Hít, Tsaagweidí Yádi, Aangoon Ḵwáan), Shḵanyadaká Elizabeth
    McCluskey (Raven, L'eeneidí, Aanx̱’aak Hít, Teiḵweidí Yádi, Aangoon
    Ḵwáan) and Kaseix̱ Selina Everson (Raven, Deisheetaan, Raven House,
    Angoon,Kaagwaantaan Yádi, grandaughter of the bear clan Teiḵweidí,
    Raven/Beaver). Recorded May 19, 2013, at Admiralty Suites, Angoon,
    AK, by Tuli.aan Carolyn Anderson and Liana Wallace.  This
    recording is continued on #96.
    </div>"

