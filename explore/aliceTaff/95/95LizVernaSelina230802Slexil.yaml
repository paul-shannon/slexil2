    utterance: 1958, yeah. 1958. That's when she became ill. I mean before that. I remember, I remember  when she called my mother. It was before my wedding. My mother was preparing for my wedding. And, uh, the phone rings. And she, it was Elizabeth Peratrovich, she called my mom to tell my mom, she said "I want to, I never did pay you when you took care of my children, all the time you took care of my children, I never did pay you sister," she said.  "I want to be able to pay you now." I'll tell this one in English. And, uh, she um, my mother was so happy to hear her because, oh, she was having a rough time trying to get things together. And, um, Elizabeth said, "I heard about the wedding,"  she goes,   "I'm gonna take it over. I'll put it together for you." Oh, it turned out so beautiful. I was so happy! And um. It's hard to talk about them, we really miss those elderly people. 

