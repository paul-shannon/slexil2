  - lineNumber: 302
    startTime: 1434289
    endTime: 1582066
    utterance: Yeah, because, like, {I never put}, I never said that, uh, like when we went up the bay we were just real young yet, Roy, Nellie, and I. And we were just little kids probably like Gabriel, seven and eight and, and, uh, uh Roy was probably about three years older than us.  And, uh, uh it was up to us always. It, it was just, an understanding after they once taught us that we had to get, um driftwood for a fire. And thatʼs the first thing we did. Weʼd jump off the boat and, and uh carry maybe a bag each up to where we were going to stay. And then we would uh, run and get driftwood because if we didnʼt then we knew we wouldnʼt eat right away. And uh,uh  then weʼd run. Thereʼd be a little creek that was by {tha} our camp there and weʼd pack water so that our mother could cook whatever she had in mind to cook for dinner. But thatʼs the one thing we always had to do was pack water to wash dishes later. And pack more wood. So we always did that. And {itʼs} I havenʼt told this in detail. But I think that if we never get another chance, at least this will be down.  But I can go into detail. I need Nellieʼs help, you know. Um, into detail about those kind of things, you know. What, what we, uh, what we did in everyday life. It takes, I have to have somebody asking me that, you know, to be able to. I could have recorded this a long time ago. I, I just need help. I canʼt do it by myself, you know. But anyway, another one that I forgot which is also in the springtime, is going to Áankaw. And I can do that now. Is the tape still on?

