    utterance: Yeah, itʼs, itʼs, itʼs really something. Just that going seasonal. We never really stayed in town all that much. But we used to be just excited. It would seem like going to Juneau for us cause we werenʼt exposed to other, other places. When I was a child I didnʼt even know there was another place, you know. I, I always thought this was the whole world; this was it. And, a, we used to just be happy to go to these places. We didnʼt know any better. We were just kids. I didnʼt include a lot of things but we can redo it again if you want. 

