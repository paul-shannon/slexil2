    utterance: Something happened to me somewhere along the way when I was growing up a child. I saw all these people singing Tlingit songs and they were drinking and I just never wanted to learn it. It just, stuck in my mind. I thought to myself, the only time they want to sing those songs is when they're drinking. That's the attitude I had. And so it's been hard for me to, you know, to accept it that it could be fun in a nice way, you know. So I just never learned the songs. I can, I can uh, if I hear Nellie singing I can follow her, but I never meant to remember them either, you know. And this is the first time I ever said it. Uh, that was why I never wanted to dance and my uncle, my brother Paul wanted Nellie and I to dance with, with uh, the St. Elias dancers when we moved back here and I just forced myself, you know. It, it, uh, it's just because I was around so many drunk people and they were singing in Tlingit and I just, it just hit me the wrong way, you know. But B.B. Williams is uh, Billy Williams, the one uh, one that's alive here now? That was his grandfather, B.B. Williams. Uh, like I say, heʼs my, he was our dad's uh, nephew.

