    utterance: Our, our, uh,    Protection?    Protector.     Protector.    Yeah, they always knew that. And, uh, it's really not too late if you can just, just, uh, talk to the kids. Even Joe and Gary were 5, uh, 3 and, and 7 when I moved back up here. And uh, I told them right from then on, I didn't quit drinking, I used to go out on weekends, not all the time, but, and I just told them, nobody told me it was going to be wrong for me. But it is. And uh, uh, you just have to be truthful with your kids. You have to take time. Especially, I was on all kinds of committies up here, and I was on the school board, the city council, Ḵwáan board and, and Johnson O'Malley and all that and teaching the language at the school and, but I'd still take time after, right after dinner and talk to them about things I think they should know. And um, and never lost that contact with them. And, and, and so they knew, you know, what to expect. It is a sad thing. It's just um, sometimes I think if our people could get educated enough, even the older ones, they can be able to get through to some of them. We're not going to save all of them, but certainly there are some that are going to listen, you know. Uh, they may as well have just killed all of us. That's how sad it is. The United States just, just absolutely walks all over us. They uh, it's just like when we were going to school; I had a cavity in my teeth right here and I went to the dentist and he said, "Oh, I'll put you on a list." Six months later I asked him, I said, "When are you going to get around to my teeth?" He looked in my mouth and he said, "Oh, they're all um, you've got cavities all over so I'm just going to pull them." He put shots in my mouth and I could feel him when he was pulling the last one out. When he left he had just big bottles of teeth. I met some of the kinds in Barrow and Anchorage and those places and they told me the same thing. That dentist just pulled their teeth. He wasn't filling their teeth he was just pulling it. And I just thought, I used to get so mad I thought to myself, I'll sue them just for that. Just for my teeth.

