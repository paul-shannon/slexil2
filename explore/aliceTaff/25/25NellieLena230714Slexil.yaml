    Speakers are Daasdiyaa Nelly Lord and Achkwéi Lena
    Farkas. Recorded July 19, 2010, at the home of Lena Farkas in
    Yakutat, Alaska, by Naakil.aan Mark Hans Chester. THIS RECORDING
    IS CONTINUED FROM # 24. IT IS CONTINUED ON # 26.
    </div>"

