    utterance: Um, it's going to take a while to get over it. And, and parents have to be involved with their children, and be truthful. And, uh, I really feel bad for those people up north. It happens down here too, but, uh, it's like they're just drowning in all that, you know, they're trying to hang on. Go to Anchorage and maybe we'll get a job at a hospital as, doing something, and, uh, it's really... And these are the older people, and they're kids getting mixed up in all this bad stuff and they just don't know how to deal with it, you know. It is bad. It's really a sad thing. And all we can do is just pray about it. Do you know that, that uh, our people always knew there was a god.

