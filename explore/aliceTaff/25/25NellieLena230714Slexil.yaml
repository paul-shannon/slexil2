  - lineNumber: 16
    startTime: 56114
    endTime: 119277
    utterance: Yeah. It was a lot of fun. You know the, I remember sometimes I used to take, when she used to have to go to Situk with my dad and my brothers cause she had tuberculosis and they didnʼt want me to catch it, Iʼd stay in town with my mother. But, like I remember one time her and, her and Mrs. B. A. Jack and Mary Collier, I took them in a canoe over to Khantaak island to fish, to pick strawberries. Oh, I wouldnʼt tell them but I was scared to look in the water. Those tall grass in the water, I always imagined a monster would come up. Iʼd never tell them. Iʼd just row and get over as soon as I can. Haaaaw. But, like we used to go over there, a, by, on this side of Point Carrew and, and uh, to pick, a, a, black seaweed,

  - lineNumber: 17
    startTime: 119477
    endTime: 120644
    utterance: laaḵ'ásk.
    translation: black seaweed.

  - lineNumber: 18
    startTime: 120844
    endTime: 132232
    utterance: There'd be lots over there. There were lots over there this, uh, this spring time. A lot of people got a lot of, uh,

  - lineNumber: 19
    startTime: 132432
    endTime: 134745
    utterance: laaḵ'ásk.
    translation: black seaweed

  - lineNumber: 20
    startTime: 134945
    endTime: 188076
    utterance: But I remember mom, our dad used to just throw a, part of a, um, tent on, on the alders there and build a fire in there and we just used to sleep. He'd make a bed for us and we'd sleep there and uh, out in the open, you know, except for that uh. We'd spend a day or two there, my, we'd really pick seaweed. And then my mom would get uh, uh, she'd take either a sheet a bed sheet or, or a tablecloth and, and dry that seaweed cause it would be nice and sunshining and, and so that would, we'd have to keep turning it.

  - lineNumber: 21
    startTime: 188276
    endTime: 191177
    utterance: Yóo áa yax̱ kiyjeil dé!
    translation: You (girls) turn it all over now!

  - lineNumber: 22
    startTime: 191200
    endTime: 242742
    utterance: And turn it and turn it. And we, she'd have it all dried the second day we come back. And I remember the men used to go up, up the bay. Harvey and , and grandpa Samson. And, and they would come down and right below on this side of the ANB hall they'd have halibut and king salmon there and, and the seal and theyʼd just say, "Help yourself." This was in the spring time because they knew everybody practically all used all their winter food by then. So they'd go up and bring down all kinds of food to eat.

