    utterance: Hey, I gotta think about it a while. Bored is not knowing what to do with yourself and, and, uh, thinking you should be doing something, something but you don't know what. When my children were small, my Gary and Joe, Joe never said anything, he was a bookworm so he was, he always had a book to read. And Gary would come to me and he says, "Mom, I'm bored."  "Go dump your dresser out and and wash the walls in your bedroom, don't tell me you're bored!" They never came to me after that. So, you know, it, it was, we had a good life. My brothers knew how to play the instrument. Robert, he could play the uh, accordian and my brother Paul played the saxophone. My brother Charles played, played the the big uh, one of those that looks like a guitar. Cello. And uh, Robert could play guitar also and uh. We'd be out Ahrnklin and on a sunshiney day Robert would get up on the roof and he'd be playing songs. And, up the Ahrnklin, in the evenings,

