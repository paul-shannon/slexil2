    utterance: May-t ḵooháaych tlei tsú yóo naakéede haa klagás'ch.
    translation: May would come and weʼd go back out to camp.

  - lineNumber: 432
    startTime: 1543081
    endTime: 1714704
    utterance: We traveled with the season. We never stayed in town for any length of time. Going to Juneau and going to Situk and Ahrnklin was like going to Juneau or Anchorage so as we'd never been to Juneau or Anchorage. So it was just fun for us cause we were doing things with our parents. You know, we were I know I was real secure until my dad died, cause we, every all the time he was, him and mom were doing things with us and traveling and protecting us. I remember the last time that we went up the Ahrnklin. My brother Robert and Nellie were in a little canoe. That's what they took up to the, you know, up, up to the mountains for mountain goat hunting. Well they were behind us and, and uh, we were in a skiff, probably about a 16-ft. skiff. And my, my little sister and myself were with, with our mother in back of the skiff. And Nellie was with, with Robert. We were kinda towing them, you know; they were behind us. And the ice was already coming down. And my father, he was an old man already but he was tall like huge, just big and broad.  I couldn't believe it. He jumped out of the boat in that ice water and pulled the boat, the skiff so that we could pull them cause they were getting iced in there and we still had about two or three miles to go to, to the camp we were going to. And, uh, that was last time I could remember we went. We went trapping because Roy and, and my sister Nellie had to go to the sanitarium in Skagway and I think my dad just didn't have the heart to go up there without them and so we never did go back. There was a comic I found in that trapping camp that I couldn't read. When my mother told us to lay down to nap on the top bunk, we used to look out the window. She saw a big frog out there. And then, I'd be laying there looking at that comic. And one year I came back and I could read it. That little comic stayed there all those years.

