  - lineNumber: 17
    startTime: 99121
    endTime: 102891
    utterance: Tle wé ??? a tóonáx̱ áwé naadaa.
    translation: And from over there, through it the creek flows.

  - lineNumber: 18
    startTime: 107300
    endTime: 112827
    utterance: Náakw áyá yéi yatee yá héen yíxʼ ??? [duneeyí?].
    translation: It is medicine to ??? in the river (valley, or near the river). 

  - lineNumber: 19
    startTime: 113027
    endTime: 120272
    utterance: A tayee, a tóode, tle yáat, tle chʼas,  chʼa áwé yéi yatee.   
    translation: Underneath it, going into it, just like here, it is all (solid) rock.

  - lineNumber: 20
    startTime: 120472
    endTime: 124910
    utterance: Wé ax̱ x̱án.aach áwé «Aadé, aadé, a tóode nax̱too.aat,» yóo x̱at daayaḵá.
    translation: That spouse of mine, "(In)to there, (in)to there, letʼs go inside there," he said to me.

  - lineNumber: 21
    startTime: 125110
    endTime: 131800
    utterance: «Xá, a ihí!» yóo daayax̱aḵá, «Tlél ax̱ tuwáa ushgú aadé x̱wagoodí.»
    translation: "Oh, stop!" I said to him, "I donʼt want to go (in) there."

  - lineNumber: 22
    startTime: 132000
    endTime: 138520
    utterance: «Yei gax̱tusatéen goodáx̱ sáyú naadaa,» yóo x̱ʼayaḵá.
    translation: "Weʼll see where that water flows out from," he said.

