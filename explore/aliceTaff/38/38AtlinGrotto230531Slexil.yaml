  - lineNumber: 88
    startTime: 484704
    endTime: 523851
    utterance: He was walking in this water. He walk in it all the way down. My sister was walking in it; sheʼs older than Violet; and they ask ???. Here she's making faces and things sheʼs ??? and they got big tree, he throw it in the water and he had her screaming going down. It always sounds so peaceful, Iʼm glad you set tent up.

  - lineNumber: 89
