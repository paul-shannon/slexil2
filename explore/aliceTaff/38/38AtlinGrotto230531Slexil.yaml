    translation: That is the last one.

  - lineNumber: 34
    startTime: 189496
    endTime: 196540
    utterance: Tlél tsu us.át’x̱ yóo kdunéek tle ch’a tleix̱ yáa yéi yan ul.láaych.
    translation: They say it never even gets cold, it just stays thawed out like this all the time.

  - lineNumber: 35
    startTime: 199121
    endTime: 205351
    utterance: You get the most beautiful {weath} watercress in here.

  - lineNumber: 36
    startTime: 206688
    endTime: 207380
