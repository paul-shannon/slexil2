    utterance: Thatʼs mud. And he put that inside it. And some of the, uh, birds took off. "Oh yeah, I know how to make a nest. I know how to make a nest." So they took off. And then he took feathers, sort of like down feathers from from his chest. Around his chest and stuff. And put it on there. And some of the birds took off again, "I know how to make a nest. I know how to make a nest." And by the time he got through, he said, "OK, hereʼs the nest," there was just one little bird sitting there. And he learned how to make a nest from the beginning to the end. And thatʼs a parable. And if youʼre going to learn something, do it from the first to the end. Donʼt get up and go. Because you wonʼt know how to really do it. And that,  thatʼs the thing behind it. And these are things he likes to tell and theyʼre true. You have to, a, stay there from beginning to end if you really want to learn how to make a nest. {If you want } If you really want to learn,     Anything       to how, how to do anything, whatever is, is offered to you that you want to do, from the beginning to the end. Itʼs just like 

