  - lineNumber: 67
    startTime: 569179
    endTime: 830058
    utterance: Mhm. This is really long time ago talk. And they did, the people a long time ago, the Tlingit was sort of different than what it is today. And uh, this little, what did he call it, wolverine, used to go around the mountains, the face of the mountains there looking. Looking down in the water, down the beach, see whatʼs going on. And this one day, they saw a little rock moving. And they told him, "Go down there and see what  that little rock, why itʼs moving." And so thereʼs, what theyʼre telling him is, when you see something different happening down there, you go down there and find out what it is. And, and so all these little parables are taught, um,  so that you remember. And the parables of different things that they ask of you. Itʼs just like this one, a couple years ago, down at Celebration, I heard, um, Clarence Jackson tell this one that I thought was so neat. And I donʼt know if anybody from Yakutat heard what he said. He was thanking the people of Yakutat because they came dancing in first. They always pick what dance groupʼs going to come dancing in first. And, a, he said, everybody from this village had gone fishing. They were all gone except for the old ladies and the old men. And this old man in the morning, before the sun came up, heʼd go down the beach there, sit on a big rock and heʼd watch the sun coming up. And this little boy, every morning went down to get water and come back. And he used to  wonder what this old man was doing going down to the rock, sitting there and watching the sun come up. Heʼd sit there until the sun went down.  And one day the old man didnʼt show up. So the little boy ran down there to the rock and he thought to himself, well, Iʼm going to try this. Iʼm going to go sit on a rock and sit there for, for as long as that old man used to sit. So he sat there and he watched the sun come up until it went down. And he wondered why the old man did this and he found out.  The sun used to warm him through his whole body and made him feel good cause he had arthritis too and probably some other ailment.  But this sun getting him warm was why he sat there all the time from morning til, til night. And uh, this is what, uh, Clarence Jackson said to the Yakutat dancers, St. Elias Dancers,  he said, {he made} this young man made uh, realize the sun made him feel warm and warmed his body up and felt good. And he said, "This is the way you folks, the St. Elias Dancers, has made me feel and I want to thank you." So the dancers made him feel good. And thatʼs why he used that as a parable saying, "This is the way you made me feel." 

