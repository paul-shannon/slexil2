    utterance: Ok. Iʼm going to say it in English. We usually, if we have a fish, whether itʼs king salmon or halibut, and we want to cook it, supposing we didnʼt, forgot to get a frying pan. So, weʼd gather, uh, skunk cabbage. Weʼd dig the hole and weʼd put the skunk cabbage around depending on how big the fish is. And put the skunk cabbage inside, all over in that hole.  And put the, and clean the fish and put it in there. Then you get some more skunk cabbage, real good, enough so that you got it on top of each other on there. And then you either put the gravel or sand on top of that, whatever you have handy. And then you fix a fire with the stones, with the flat rocks on top of that and build a fire on top of that so that the rocks get hot and the fish cooks. And you put it in there for, thinking how long will it take? 

