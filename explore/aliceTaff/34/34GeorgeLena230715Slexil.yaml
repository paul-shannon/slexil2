    utterance: She wants to learn Tlingit. She wants to read and write it. She wants to live it. And so sheʼs going to take all the advantage of, of all the recordings and what she already knows until she can sit and talk. Talk and say, "This is the way we do it. This is the way itʼs done. "And Iʼm real proud of her cause sheʼs one of the few that really wants to take the language. So is Joeʼs, uh, uh, grandson. And theyʼre determined theyʼre going to learn. And these are the kind of people that I like to help that I know they want to do it and, and talk it and write it and live it. Even, even if it happens like this uh, um, glacier galloped again, sheʼd know, what to do. Uh, either weʼd get in a boat and save ourself or call for help on the, a, army and stuff. Weʼd have to move to a different place. But sheʼll remember and have all the things that, that a, the way our life used to be here. Maybe weʼd only move 40 or 50 miles away but she still remember all the things we did here. And so thatʼs what heʼs, what heʼs, a, talking about. 

  - lineNumber: 11
    startTime: 244214
    endTime: 350662
    utterance: When, when they told me the story, they, they told me the story quite  a few times. And like I was telling you, the, the, the uncle is a shrewd man. He donʼt say youʼre a good boy. He donʼt tell you, "Good." ??? You make a mistake, heʼll say, "Ooh! You sissy or you ???" Thatʼs the way they ??? One of the birds that built a perfect nest is the hummingbird. The other one that was sitting there, I forgot because I never used it for so long. And I donʼt know, just as some, somebody some place who heard the story, they could tell me what the other bird is that was sitting there last. But this is the way they used to instruct young boys. Like I said, we talk about Blackskin. [Duktóotl] Blackskin is one of the first stories they tell you. Theyʼll tell you the story of what he did. How he pulled up a tree. How he tore the sealion in half. But they never tell you the moral of the story. Why are they telling you? The moral of the story is, he trained himself. They call it self discipline. And so thatʼs why they tell you that story.  

