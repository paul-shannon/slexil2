  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    Speakers are Kooshdaakʼw Éesh William B. Fawcett (Yéil, Lukaax̱ádi,
    Deishu Hít, Tʼeinaag̱ʼei Ḵwáan, Gunanáa Yádi, grandchild of Daxk
    Ḵwáan Jim Boss) and G̱unaakʼw Fred White (Eagle, Thunderbird,
    Thunderbird House, DryBay/Alsek River Ḵwáan, Lukaax̱ádi Yádi,
    grandchild of Lʼuknax̱.ádi).  Recorded June 4, 2012, in Juneau, AK,
    at the home of Bill and Barbara Fawcett by Ljáaḵkʼ Alice Taff.
    </div>"

