    utterance: You take so much off and you put it on this piece of skin. And you spread it around all over. And you let it cool off. Just warm enough so it wonʼt hurt you, it wonʼt burn you. And you put it on. And you can leave it on there for one or two days. And you take it off. That boil will be all gone. And you, people use it for a lot of other sores. You remember quite a while ago thereʼs, during the war, there was lot of sores going around, eh? My mom was really busy with that. That, in that, balsam pitch. {We} we call balsam pitch ointment.

