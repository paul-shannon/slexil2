    endTime: 614545
    utterance: Cause I heard a story long time ago. Auntie Miss Nyman tell me about. Where {that} that boy, that family, his family. He went out hunting in this ocean. And somehow his brothers they were jealous of him, they say. And they said {he} he pass away out there. But he never. They say, she say, he live on a island. He go, he live on a island. And he come back. He sneak back sometime, to check on those people. And his brothers took over everything of his. And they said, he live on that island, they said, out of that driftwood or cedar, whatever. They say he carve, carved that whale.  And he put that whale in the water, and that whale come to life, they say, he started swim around. And she said the first time that whale, he kill people. He kill those, his brothers off, after what they did to him. {He got} he went and got his brothers. That killer whale, they say, killed that brothers. And then he tell that killer whale, "From here," he say, "from here on in, youʼre not going to kill another human being, ever again." And that was part of that story about how that killer whale come to be. Thatʼs what Auntie Miss Nyman. You know her, Mrs. Nyman, from Atlin? Yeah. She tell me that. But I canʼt remember parts of it. But she said about that killer whale. And then I think about it. Not too long ago they say that killer whale kill somebody {in} in Vancouver, training. One of those people training. 

