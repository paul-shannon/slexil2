  - html: "<div style='margin: 30px; margin-left: 100px; margin-right: 100px;'>
    This recording is a continuation of #35 Atlin.  Speakers are
    Kaséix̱ Selina Everson, Seidayaa Mary Anderson, Ḵeixwnéi Nora Marks
    Dauenhauer, Sháayi Éesh Smith Katzeek, and Naakil.aan Mark Hans
    Chester. Recorded August 10, 2010, at 5-mile gazebo on Atlin Lake,
    Yukon Territory, Canada, by Ljáaḵkʼ Alice Taff.
    </div>"

