  - lineNumber: 67
    startTime: 437761
    endTime: 495945
    utterance: She couldn't eat anymore so I gave her a piece of dry fish. She'd just hold it by her mouth. And I told Steve, I said, "You know, talk about, everybody says they just give us too much leeway on getting substance fishing.These things are our life. My mother took hers to her grave with her." And uh, he said, "Geez." And, and yet these people don't even think of it that much and yet they complain about it. What would they do with it if we had that much, if they could get that much fish and make dry fish out of it? They'd start selling it. That's what they do. And it's true you know.

