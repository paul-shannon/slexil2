    utterance: Peel the skin off the willow, and, and she'd send us to the store to get black bull? Blackbull, to make snuff. And she'd take, take us to the smokehouse, build a fire in a can, for, for the ashes for the snuff, to fix with the snuff. And she'd put the, the, uh, Blackbull in a, in uh, one of those oven pans until it got crispy and then she'd, sheʼd mix it with the alders. And that would be their snuff.      She had a bowl like made out of wood and she'd, to make the snoose. Oh. When they, we, we used to go to. Lidzée ḵustí. We used to go to, um, Arlene, her mom. She was a real good friend of ours.

