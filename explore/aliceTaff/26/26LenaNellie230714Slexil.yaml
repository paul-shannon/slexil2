    utterance: Blackbull. Ah shucks. We were still kids yet when they used to. Everybody would go over to Ankau on Memorial Day, before they even built that road going out. The army during World War Two build that road going out there. But before that I remember we went out there on the boat. Everybody would go out on a boat and they'd, they'd take their lunch, you know. And everybody would clean all the, all the graves and then have lunch, like a picnic and come back home. Now everybody goes just whenever they feel like it. And Ḵwáan turned that land over to the city because they had to give a certain percent to the city, of land. And I think it was 80 acres, something like that. And the city has never taken the, never, ever cleaned it. Well, you know, they could hire someone to clean it and keep it up but they never did. In fact when, about maybe five or six years ago, they uh, boy they were going to get land from Ḵwáan and uh, I said, "Well Lowell was still on the board. Go ask him. I know that we turned over a certain amount of, of ah, acres of, land to the city." And the garbage dump was another. We didn't want to give them anything right in town, you know. That was Ḵwáan's land.

