# It wasn’t suspended up above in the sky.
# Well,
# are you going to interpret what I say? This is why {…},
# that’s why I’m not—.
# Johnson: It’s this recorder you are speaking into; continue telling the story.
# Okay.
# So,
# when he was here on the earth,
# the moon, that is,
# all of the inhabitants of the world were afraid of what he could do.
# Because the tide
# was under his authority,
# the moon was called Tide-Commander.
# The Tlingit people call him
# Tide-Commander.
# So,
# when—
# when he was on the earth,
# he did not allow any children to be raised in his sister’s care.


