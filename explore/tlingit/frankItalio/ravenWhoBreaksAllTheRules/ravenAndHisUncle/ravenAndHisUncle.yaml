              <h5>Ḵuchéin, Frank Italio (1870–1956)</h5>
              <img src='frankItalio-thunderbirdHouse-1918.jpeg'
                       width='400'>
              <div style='margin: 20px; margin-left: 2px; width: 500px; white-space: normal;'>
              Figure 3 from Yéil Kundayaayí. This may be
              the only photograph that exists of Frank Italio. This is
              a detail of a larger image taken on glass plate in Dry
              Bay, c. 1918. He stands inside Xeitl Hít ‘Thunderbird
              House’, a Shangukeidí clan house erected in Dry Bay in
              1909. Behind him is the Xeitl X̱ ’éen ‘Thunderbird
              Screen’, which now resides at the Alaska State Museum in
              Juneau. Photo by Fhoki Kayamori. Courtesy of Bryn Mawr
              College Special Collections, bmc-1975-06, box 13, folder
              2. See de Laguna, Under Mount Saint Elias, plate 215,
              1144–55, for the full image and further details and
              identification.  </div>
           </div>"


