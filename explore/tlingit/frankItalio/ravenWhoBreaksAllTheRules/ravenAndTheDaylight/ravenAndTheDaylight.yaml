    english: a down feather.
    
  - lineNumber: 37
    startTime: 108089
    endTime: 110393
    tlingit: Tle neildé yaa nadus.íni xáanaa,
    english: As the pail was being brought into the house that evening,
    
  - lineNumber: 38
    startTime: 111550
    endTime: 112769
    tlingit: xi.aat yáx̱ ḵuteeÿí,
    english: with the world being dark like dusk,
    
