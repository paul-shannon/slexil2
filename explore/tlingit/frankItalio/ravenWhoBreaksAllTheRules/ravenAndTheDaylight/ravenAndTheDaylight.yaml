    tlingit: yáa ḵ’watlg̱eig̱anx̱áas’ináx̱ adaná
    english: that the noble child
    
  - lineNumber: 51
    startTime: 139750
    endTime: 140759
    tlingit: yú aanÿédi.
    english: drank from the place where the bentwood pail was lashed together.
    
  - lineNumber: 52
    startTime: 143310
    endTime: 145035
    tlingit: Anax̱ áwé oodanáaÿch.
    english: She always drank from there.
    
  - lineNumber: 53
    startTime: 145600
    endTime: 147204
    tlingit: Anax̱ adana yé ḵudzitee.
    english: There was a place from which she drank.
    
  - lineNumber: 54
    startTime: 149261
    endTime: 153472
    tlingit: Tle yá ḵ’watlg̱eig̱anx̱áas’i tayeex̱ áwé kei sh wuditsáḵ, g̱ítg̱aa tóox̱ sh ḵuwdli.oo.
    english: Then, concealed inside an evergreen needle, he just shoved himself up under the place where the box was lashed together.
    
  - lineNumber: 55
    startTime: 157250
    endTime: 160783
    tlingit: Tle koodlidéin ÿaa aa nanút’i áwé tsá a yíkde, hóoch’.
    english: As she was finally taking a great big gulp of it, he slid into her and that was that.
    
  - lineNumber: 56
    startTime: 161561
    endTime: 163266
    tlingit: Tlél áx̱ jiyawuxaash.
    english: She couldn’t have anticipated what was coming.
    
  - lineNumber: 57
    startTime: 164136
    endTime: 166728
    tlingit: {X’éig̱aa} áwé alḵáx̱ch, tléik’.
    english: She {really} tried to cough it up, but no.
    
  - lineNumber: 58
    startTime: 168399
    endTime: 170815
    tlingit: Wáanée sáwé deisguch ilḵú wé aanÿédi.
    english: Eventually the noble child started vomiting.
    
  - lineNumber: 59
    startTime: 171629
    endTime: 172597
    tlingit: Ilḵú.
    english: She was vomiting.
    
  - lineNumber: 60
    startTime: 173437
    endTime: 175075
    tlingit: «Kéi kg̱eelḵóo ltín.»
    english: “You’ll just throw up, see.”
    
  - lineNumber: 61
    startTime: 176218
    endTime: 180179
    tlingit: Tle yan ilḵóo du yídáx̱ kéi kawdak’éet’i áwé át akandulgánch.
    english: When she was through vomiting, when it had all come out of her, a torchlight was shone around.
    
  - lineNumber: 62
    startTime: 180362
    endTime: 182184
    tlingit: Daa sá awunóot’i tléil wuduskú.
    english: No one knew what she had swallowed.
    

