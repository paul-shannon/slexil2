    english: was being taken back to her room for her to drink from.
    
  - lineNumber: 34
    startTime: 100383
    endTime: 102804
    tlingit: Tle yá x̱’awooldáx̱ áwé a kaadé sh wudig̱éex’.
    english: So he hurled himself down into the pail from the doorway.
    
  - lineNumber: 35
    startTime: 103416
    endTime: 104243
    tlingit: X̱ ’wáal’
    english: He had fitted himself inside of
    
