  - lineNumber: 17
    startTime: 49386
    endTime: 50240
    tlingit: «Hadóo!
    english: “Good grief!                                                                                                    

  - lineNumber: 18
    startTime: 51681
    endTime: 55516
    tlingit: Chaa goodáx̱ Naasshagiyét sáyú ḵei.á du jee yéi ng̱atee?»
    english: From where does the Child-of-the-Head-of-the-Nass hail that he should possess daylight?”                        

  - lineNumber: 19
    startTime: 57856
    endTime: 62427
    tlingit: Tle ch’u tle áa shukawdujaaÿéyáx̱ áwé woonei ḵei.á áa yéi yateeyi yé.
    english: It was as if they had given him directions to where the daylight resided.                                       

  - lineNumber: 20
    startTime: 63211
    endTime: 65825
    tlingit: Ách áwé tle woogoot Náas Sháakde.
    english: So then he set out walking towards the headwaters of the Nass River.                                            

  - lineNumber: 21
    startTime: 67486
    endTime: 68681
    tlingit: Yéil á.
    english: This was Raven.                                                                                                 

