title: Lushootseed Book 2
narrator: Thom Hess
textEntry: Paul Shannon
mediaFile: https://slexildata.artsrn.ualberta.ca/lushootseed/grammar/volume2.wav
mimeType: audio/wav

lines:
  - html: "<div class='lessonTitle'>Lesson Twenty-Eight: saliʔačiʔ ʔi ti təqačiʔ</div>"

  - html: "<div style='margin-left: 30px'><h5> Choral Repetition</h5></div>"

  - html: "<div class='sectionNumber'>28.1</div>"

  - startTime: 15905
    endTime: 18596
    lushootseed: ʔuqəɬdubicid čəd (ʔ)u.
    english:  Did I wake you up?

  - startTime: 24107
    endTime: 29196
    lushootseed: ʔi.  ʔuqəɬdubš čəxʷ. gʷəƛ̓əladəxʷ.
    english: Yes.  You woke me up.  Keep still now!

  - html: "<div class='sectionNumber'>28.2</div>"

  - startTime: 40636
    endTime: 44433
    lushootseed: gʷəqəɬc čəxʷ (ʔ)u [ʔal kʷi] ɬup dadatu.
    english: Would you wake me up tomorrow morning?

  - startTime: 50668
    endTime: 58765
    lushootseed: xʷiʔ gʷədsqəɬcid.  cick̓ʷ čəxʷ ƛ̓uʔitut ʔə tə tib.  xʷiʔ gʷ(ə)adsqəɬ.
    english: I won't wake you up.  You (habitually) sleep very heavily.  You won't wake up.

  - html: "<div class='sectionNumber'>28.3</div>"

  - startTime: 72678
    endTime: 78392
    lushootseed: tu(u)k̓ʷəɬalikʷ čəd ʔə ti kupi čəda tuk̓ʷəɬdxʷ.
    english: I was serving the coffee but I spilled it.

  - html: "<div class='sectionNumber'>28.4</div>"

  - startTime: 90961
    endTime: 95472
    lushootseed: hiwil, čəxʷa k̓ʷəɬəd tiʔəʔ ʔəsƛ̓ux̌ʷil kupi.
    english: Go pour out this cold coffee.

  - html: "<div class='sectionNumber'>28.5</div>"

  - startTime: 106530
    endTime: 112071
    lushootseed: tuqadacut ti dstaləɬ gʷəl tucaq̓dxʷ tiʔiɬ dq̓il̓bid.
    english: My nephew was backing up and had an accident with my car.

  - html: "<div class='sectionNumber'>28.6</div>"

  - startTime: 124317
    endTime: 132951
    lushootseed: ʔux̌icil tiʔiɬ č̓ač̓as gʷəl ʔucaq̓ad tiʔiɬdbiʔbədaʔ ʔə təx̌ʷəc qʷəɬayʔ.
    english: That youngster got angry and jabbed my little boy with a sharp stick.

  - html: "<div class='sectionNumber'>28.7</div>"

  - startTime: 149613
    endTime: 155078
    lushootseed: tutagʷalik čəd ʔə ti qʷəɬiʔ gʷəl hiqab mimʔad.
    english: I bought a (pair of) shoes but they are too small.

  - startTime: 164714
    endTime: 167123
    lushootseed: xʷiʔəxʷ gʷədsƛ̓aldxʷ.
    english: I can't get them on.

  - html: "<div class='sectionNumber'>28.8</div>"

  - startTime: 175397
    endTime: 178949
    lushootseed: ƛ̓alš tiʔiɬ adšiqʷ gʷəšədᶻaləxʷ.
    english: Put your hat on if you go out.

  - startTime: 179651
    endTime: 181926
    lushootseed: diʔɬ kʷi gʷəsqəlbs.
    english:  It might rain.

  - html: "<div class='lessonTitle'>Lesson Twenty-Nine: saliʔačiʔ ʔi ti x̌ʷəl</div>"

  - html: "<div style='margin-left: 30px'><h5> Choral Repetition</h5></div>"

  - html: "<div class='sectionNumber'>29.1</div>"

  - startTime: 197516
    endTime: 202576
    lushootseed: huk̓ʷuy, x̌aƛ̓txʷ čəɬ ti sqəbuʔ.
    english: Little girl! We want some milk.

  - startTime: 202731
    endTime: 204908
    lushootseed: gʷəʔƛ̓txʷ čəxʷ (ʔ)u.
    english: Would you bring it?

