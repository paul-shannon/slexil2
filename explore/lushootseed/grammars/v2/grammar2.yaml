title: Lushootseed Book 2
narrator: Thom Hess
textEntry: Paul Shannon
#mediaFile: https://slexildata.artsrn.ualberta.ca/lushootseed/grammar/volume2.wav
mediaFile: volume2.wav
mimeType: audio/wav

lines:
  - html: "<div class='lessonTitle'>Lesson Twenty-Eight: saliʔačiʔ ʔi ti təqačiʔ</div>"

  - html: "<div style='margin-left: 30px'><h5> Choral Repetition</h5></div>"

  - html: "<div class='sectionNumber'>28.1</div>"

  - startTime: 15905
    endTime: 18596
    lushootseed: ʔuqəɬdubicid čəd (ʔ)u.
    english:  Did I wake you up?

  - startTime: 24107
    endTime: 29196
    lushootseed: ʔi.  ʔuqəɬdubš čəxʷ. gʷəƛ̓əladəxʷ.
    english: Yes.  You woke me up.  Keep still now!

  - html: "<div class='sectionNumber'>28.2</div>"

  - startTime: 40636
    endTime: 44433
    lushootseed: gʷəqəɬc čəxʷ (ʔ)u [ʔal kʷi] ɬup dadatu.
    english: Would you wake me up tomorrow morning?

  - startTime: 50668
    endTime: 56700
    lushootseed: xʷiʔ gʷədsqəɬcid.  cick̓ʷ čəxʷ ƛ̓uʔitut ʔə tə tib.
    english: I won't wake you up.  You (habitually) sleep very heavily.

  - startTime: 57136
    endTime: 58765
    lushootseed: xʷiʔ gʷ(ə)adsqəɬ.
    english: You won't wake up.

  - html: "<div class='sectionNumber'>28.3</div>"

  - startTime: 72678
    endTime: 75552 
    lushootseed: tu(u)k̓ʷəɬalikʷ čəd ʔə ti kupi.
    english: I was serving the coffee.

  - startTime: 75876
    endTime: 78392
    lushootseed: čəda tuk̓ʷəɬdxʷ.
    english: But I spilled it.

  - html: "<div class='sectionNumber'>28.4</div>"

  - startTime: 90961
    endTime: 95472
    lushootseed: hiwil, čəxʷa k̓ʷəɬəd tiʔəʔ ʔəsƛ̓ux̌ʷil kupi.
    english: Go pour out this cold coffee.

  - html: "<div class='sectionNumber'>28.5</div>"

  - startTime: 106530
    endTime: 112071
    lushootseed: tuqadacut ti dstaləɬ gʷəl tucaq̓dxʷ tiʔiɬ dq̓il̓bid.
    english: My nephew was backing up and had an accident with my car.

  - html: "<div class='sectionNumber'>28.6</div>"

  - startTime: 124317
    endTime: 132951
    lushootseed: ʔux̌icil tiʔiɬ č̓ač̓as gʷəl ʔucaq̓ad tiʔiɬ dbiʔbədaʔ ʔə təx̌ʷəc qʷəɬayʔ.
    english: That youngster got angry and jabbed my little boy with a sharp stick.

  - html: "<div class='sectionNumber'>28.7</div>"

  - startTime: 149613
    endTime: 155078
    lushootseed: tutagʷalik čəd ʔə ti qʷəɬiʔ gʷəl hiqab mimʔad.
    english: I bought a (pair of) shoes but they are too small.

  - startTime: 164714
    endTime: 167123
    lushootseed: xʷiʔəxʷ gʷədsƛ̓aldxʷ.
    english: I can't get them on.

  - html: "<div class='sectionNumber'>28.8</div>"

  - startTime: 175397
    endTime: 178949
    lushootseed: ƛ̓alš tiʔiɬ adšiqʷ gʷəšədᶻaləxʷ.
    english: Put your hat on if you go out.

  - startTime: 179651
    endTime: 181926
    lushootseed: diʔɬ kʷi gʷəsqəlbs.
    english:  It might rain.

  - html: "<div class='lessonTitle'>Lesson Twenty-Nine: &nbsp; <i>saliʔačiʔ &nbsp; ʔi &nbsp;ti &nbsp;x̌ʷəl</i></div>"

  - html: "<div style='margin-left: 30px'><h5> Choral Repetition</h5></div>"

  - html: "<div class='sectionNumber'>29.1</div>"

  - startTime: 197516
    endTime: 202576
    lushootseed: huk̓ʷuy, x̌aƛ̓txʷ čəɬ ti sqəbuʔ.
    english: Little girl! We want some milk.

  - startTime: 202731
    endTime: 204908
    lushootseed: gʷəʔƛ̓txʷ čəxʷ (ʔ)u.
    english: Would you bring it?

  - startTime: 214227
    endTime: 216136
    lushootseed: čad kʷi sʔas.
    english: Where is it?

  - startTime: 219961
    endTime: 223879
    lushootseed: ʔədəkʷ ʔal ti səxʷƛ̓ux̌ilali.
    english: It is in the refrigerator.

  - html: "<div class='sectionNumber'>29.2</div>"

  - startTime: 233804
    endTime: 237974
    lushootseed: ʔux̌ʷtxʷ ti sqəbuʔ dxʷdiʔadiʔ
    english: Take the milk to the other room.

  - startTime: 246547
    endTime: 248615
    lushootseed: čad gʷədsʔahəd.
    english: Where should I put it?

  - startTime: 250350
    endTime: 252860
    lushootseed: dəgʷaš ʔal ti səxʷƛ̓ux̌ʷilali.
    english: Put it in the refrigerator.

  - html: "<div class='sectionNumber'>29.3</div>"

  - startTime: 261637
    endTime: 267764
    lushootseed: šədᶻaltxʷ ti sqʷəbayʔ čəxʷa ʔibəštxʷ. hagʷəxʷ t(u)ashədʔiw̓.
    english:  Take the dog outside now and walk him.  He's been inside for a long time.

  - startTime: 279817
    endTime: 282474
    lushootseed: čad əw̓ə kʷi sʔa ʔə ti t̓əbiɬəds.
    english: Where is his rope?

  - startTime: 287941
    endTime: 290856
    lushootseed: ʔəbəč gʷədabac ʔə tə tibu.
    english: It's lying under the table.

  - html: "<div class='sectionNumber'>29.4</div>"

  - startTime: 301360
    endTime: 303935
    lushootseed: ʔəɬtxʷaxʷ ti sqʷəbayʔ.
    english: Feed the dogs now.

  - startTime: 305468
    endTime: 311023
    lushootseed: xʷuʔələ ʔestagʷəxʷ (h)əlgʷəʔ yəx̌i ʔuc̓iw̓c̓iw̓.
    english: They must be hungry because they are whining.

  - startTime: 322842
    endTime: 325144
    lushootseed: čad kʷi sʔəɬəds (h)əlgʷəʔ.
    English: Where is their food?

  - startTime: 329272
    endTime: 331247
    lushootseed: xʷiʔ gʷədsəs(h)aydxʷ.
    english: I don't know.

  - startTime: 331568
    endTime: 332754
    lushootseed: gʷeč̓ədəxʷ.
    english: Look for it.

  - html: "<div class='sectionNumber'>29.5</div>"

  - startTime: 344236
    endTime: 350680
    lushootseed: hiwil! yəcəbtxʷ t(i) adbad: ʔuɬčiləxʷ ti ʔihišədčəɬ.
    english: Go ahded.  Tell your father, our relatives have arrives now.

  - startTime: 361128
    endTime: 363021
    lushootseed: čad kʷi sʔas.
    english: Where is he?

  - startTime: 365554
    endTime: 368120
    lushootseed:  čəgʷalətxʷ ti suyayu(s)s.
    english: He's working outside.

  - html: "<div class='sectionNumber'>29.6</div>"

  - startTime: 390772
    endTime: 394663
    lushootseed: gʷəʔux̌ʷtubš čəxʷ (ʔ)u dxʷʔal ti xʷuyubalʔtxʷ.
    english: Would you take me to the store?

  - startTime: 394982
    endTime: 396656
    lushootseed: ʔəsdᶻix̌gʷiɬ čəd.
    english: My car broke down.

  - startTime: 397523
    endTime: 400931
    lushootseed: q̓ilagʷi(l). ɬuʔux̌ʷtucicid čəd.
    english: Get in.  I'll take you.

  - html: "<div class='sectionNumber'>29.7</div>"

  - startTime: 408777
    endTime: 411400
    lushootseed: gʷət̓uk̓ʷtubš čələp (ʔ)u.
    english: Would you folks take me home?
 
  - startTime: 411738
    endTime: 413742
    lushootseed: ʔəsƛ̓alƛ̓alab čəd.
    english: I'm stranded.

  - startTime: 421505
    endTime: 425170
    lushootseed: q̓ilagʷi(l).  ƛ̓ubalx̌ʷəd čəɬ t(i) adʔalʔal.
    english: Get in.  We (generally/habitually) pass your home.

  - html: "<div class='lessonTitle'>Lesson Thirty: &nbsp; <i>ɬixʷačiʔ</i></div>"

  - html: "<div style='margin-left: 30px'><h5> Choral Repetition</h5></div>"

  - html: "<div class='sectionNumber'>30.1</div>"

  - startTime: 437543
    endTime: 440762
    lushootseed: cick̓ʷ ʔuq̓aƛ̓əb ʔal tiʔəʔ sləx̌il.
    english: It is very cloudy today.

  - startTime: 441334
    endTime: 446055
    lushootseed: ƛ̓alš t(i) adšiqʷ. diʔɬ kʷi ɬusqəlbs.
    english: Put on your hat.  It might rain.

  - html: "<div class='sectionNumber'>30.2</div>"

  - startTime: 460614
    endTime: 464012
    lushootseed: cick̓ʷ t̓əs ʔal tiʔəʔ sləx̌il.
    english: It is very cold today.

  - startTime: 464799
    endTime: 467085
    lushootseed: ƛ̓alš t(i) adkəpu.
    english: Put on your coat.

  - startTime: 467847
    endTime: 470333
    lushootseed:  diʔɬ kʷi ɬusqʷats.
    english: It might snow.

  - html: "<div class='sectionNumber'>30.3</div>"

  - startTime: 486589
    endTime: 490263
    lushootseed: laʔb ʔəsqʷšab ʔal tiʔəʔ sləx̌il.
    english: It is really foggy.

  - startTime: 491531
    endTime: 494157
    lushootseed: haʔɬ kʷ(i) adsə(s)šuucbicut.
    english: Look after yourself well.

  - startTime: 506103
    endTime: 508316
    lushootseed: diʔɬ kʷi gʷ(ə)adsx̌ʷil̓
    english: You might get lost.

  - html: "<div class='sectionNumber'>30.4</div>"

  - startTime: 513161
    endTime: 516597
    lushootseed: laʔb ʔusuxʷil ʔal tiʔəʔ sləx̌il.
    english: It is really windy today.

  - startTime: 526873
    endTime: 528817
    lushootseed: xʷiʔ kʷ(i) adsʔuluɬ.
    english: Don't travel by water.

  - startTime: 529333
    endTime: 532020
    lushootseed: diʔɬ kʷi gʷ(ə)adsgʷal.
    english: You might overturn.

  - html: "<div class='sectionNumber'>30.5</div>"

  - startTime: 537908
    endTime: 541107
    lushootseed: ʔugʷilič̓əb tiʔəʔ qa sčusad.
    english: A lot of stars are shining.

  - startTime: 551634
    endTime: 554337
    lushootseed: ɬut̓əs ʔal tiʔəʔ sɬax̌il.
    english: It will be cold tonight.

  - html: "<div class='sectionNumber'>30.6</div>"

  - startTime: 561871
    endTime: 566163
    lushootseed: ɬugʷilič̓əb tiʔəʔ ɬukʷaɬ ʔal kʷi dadatu.
    english: The sun will shine tomorrow.

  - startTime: 567509
    endTime: 569220
    lushootseed: ɬudxʷsq̓ʷəl.
    english: It will be hot.

  - html: "<div class='sectionNumber'>30.7</div>"

  - startTime: 585793
    endTime: 589255
    lushootseed: laʔb dxʷsq̓ʷəl ʔal tiʔəʔ sləx̌il.
    english: It is really hot today.

  - startTime: 596052
    endTime: 600249
    lushootseed: xʷi kʷi gʷədsəxʷƛ̓alšəb ti dpuʔtəd.
    english: I don't fell like wearing my shirt.

  - html: "<div class='sectionNumber'>30.8</div>"

  - startTime: 612131
    endTime:   615009
    lushootseed: laʔb haʔɬ sləx̌il.
    english: It is a really nice day.

  - startTime: 620201
    endTime: 623829
    lushootseed: xʷi gʷədsəxʷƛ̓alšəb ti dšiqʷ.
    english: I don't feel like wearing my hat.

  - html: "<div class='lessonTitle'>Lesson Thirty-One: &nbsp; <i>ɬixʷačiʔ ʔi ti dəč̓uʔ</i></div>"

  - html: "<div style='margin-left: 30px'><h5> Choral Repetition A</h5></div>"

  - html: "<div class='sectionNumber'>31A.1</div>"

  - startTime: 639081
    endTime: 643058
    lushootseed: tukʷaxʷatəb ʔə ti dstaləɬ tsə dsk̓ʷuy.
    english: My nephew helped my mother.

  - html: "<div class='sectionNumber'>31A.2</div>"

  - startTime: 661218
    endTime: 665375
    lushootseed: tuqəɬdub ə ti wiw̓su ti sč̓abiqʷčəɬ.
    english: The children (inadvertently) woke our great-grandfather up.

  - html: "<div class='sectionNumber'>31A.3</div>"

  - startTime: 675929
    endTime: 680564
    lushootseed: ɬut̓uk̓ʷtub ʔə tsi dstaləɬ ti dscapaʔ.
    english: My niece will bring my grandfather home.

  - html: "<div style='margin-left: 30px'><h5> Choral Repetition B</h5></div>"

  - html: "<div class='sectionNumber'>31B.1</div>"

  - startTime: 687987
    endTime: 691356
    lushootseed: tukʷaxʷatəb čəd ʔə ti dstaləɬ.
    english: I was helped by my nephew.

  - startTime: 699303
    endTime: 702633
    lushootseed: tuqəɬdub čəxʷ ʔuʔ ʔə ti wiw̓su.
    english: Were you awakened by the children?

  - startTime: 712778
    endTime: 716204
    lushootseed: ɬut̓uk̓ʷtub čəɬ ʔə tsə dstaləɬ.
    english: We will be taken home by my neice.




