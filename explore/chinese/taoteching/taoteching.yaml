  - startTime: 9659
    endTime: 13998
    speech: 處 眾 人 之 所 惡 故 幾 於 道
    pinyin: [chu,zhong,ren,zhi,suo,wu,gu,ji,yu,dao]
    translation: [dwell,many,people,their,places,disdain,hence,close,to,Tao]
    janeEnglish: JE) It flows in places people reject and so is like the Tao. 
    derekLin: DL) It stays in places that people dislike therefor it is similar to the Tao.
    ursulaLeguin: UL) It goes right to the low loathsome places, ans so find the way.
    stephenMitchell: SM) It is content with the low places that people disdain.  Thus it is like the Tao.
    arthurWaley: AW) but is content with the places that all men disdain.  It is this that makes water so near to the Way.

  - startTime: 14663
    endTime: 15967
    speech: 居 善 地
    pinyin: [ju,shan,di]
    translation: [dwelling,good,low.place]
    janeEnglish: je: In dwelling, be close to the land.
    derekLin: DL) Dwelling at the right place
    ursulaLeguin: UL) For a house, the good thing is level ground.
    stephenMitchell: SM) In dwelling, live close to the ground.
    arthurWaley: AW) And if men think the ground the best place for building a house upon,

  - startTime: 16257
    endTime: 17544
    speech: 心 善 淵
    pinyin: [xin,shan,yuan]
    translation: [heart-mind,good,depth]
    janeEnglish: je: In meditation, go deep in the heart.
    derekLin: DL) Heart with great depth
    ursulaLeguin: UL) In thinking, depth is good.
    stephenMitchell: SM) In thinking, keep to the simple.
    arthurWaley: AW) If among thoughts they value those that are profound,
