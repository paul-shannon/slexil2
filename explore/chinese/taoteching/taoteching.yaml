  - startTime: 3654
    endTime: 5800
    speech: 上 善 若 水
    pinyin: [shàng, shàn, ruò, shuǐ]
    translation: [highest, good, like, water]
    janeEnglish: JE) The highest good is like water.
    derekLin: DL) Water greatly benefits myriad things without contention
    ursulaLeguin: UL) True goodness is like water
    stephenMitchell: SM) The supreme good is like water
    arthurWaley: AW) The highest good is like that of water.

  - startTime: 6099
    endTime: 9371
    speech: 水 善 利 萬 物 而 不 爭
    pinyin: [shuǐ, shàn, lì, wàn, wù, ér, bù, zhēng]
    translation: [water, good, to benefit, ten thousand, entities, and yet, not, compete]
    janeEnglish: JE) Water gives life to the ten thousand things and does not strive.
    derekLin: DL) Water greatly benefits myriad things without contention.
    ursulaLeguin: UL) Water’s good for everything. It doesn’t compete.
    stephenMitchell: SM) which nourishes all things without trying to
    arthurWaley: AW) The goodness of water is that it benefits the ten thousand creatures; yet itself does not scramble.

