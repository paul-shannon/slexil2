    speech: 水 善 利 萬 物 而 不 爭
    pinyin: [shuǐ, shàn, lì, wàn, wù, ér, bù, zhēng]
    translation: [water, good, to benefit, ten thousand, entities, and yet, not, compete]
    janeEnglish: Water gives life to the ten thousand things and does not strive.


