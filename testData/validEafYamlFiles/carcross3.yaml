  - lineNumber: 26
    startTime: 56010
    endTime: 181180
    Utterance: You peel it, and then you boil, you donʼt boil it.  You just put it in the water, put it in the pot, put it in the pot and {put} put that, and you just bring it to a boil, and then you put a tight lid on it. And you shut it off. Donʼt boil it. You just bring it to a boil. Just when it start[s], you set it off.   And you put a cover on it really tight. And donʼt open that until itʼs cold enough to drink. Thatʼs for your cold, not only for cold, itʼs good for everything in your body.     Oh, okay.   I been using that as far as I could remember. My mom, and lot of people use it. And you can also use the pitch. Balsam pitch. That one you go and you take a can {you} and you sharpen up a stick or you take table knife. You pick them off the tree and you put it in that can. And when you bring it home you take all the bark and {little} all the dirt off of it. No dirt or nothing in it. And you put on the stove in a warm, just low heat. And itʼs going to melt. Itʼs going to melt and itʼs going to look just like butter. You stir it up with that wooden stick. And then if you got a sore some place in your arm, your ,wherever you get sore. Itʼs good for boil. You put that. And then you get piece of skin [hide] how big you, where youʼre going to put it. And you heat it up just warm enough to start spreading. It gets just soft when you heat it up. Just really soft. You use, always use the same stick.
    translation: [When Winnie talks about using the sharp stick, pieces of pitch from the tree can be scraped into your can. You can also poke holes in the balsam tree bark blisters so some of the pitch runs out into your can.]
    Speaker Initials: DWA, GBJ, DWA

